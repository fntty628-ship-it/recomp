<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="計量室">
<meta name="description" content="筋量を保ったまま減量するための 食事・運動・体組成トラッカー">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}</style>
<title>リコンプ計量室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================
   リコンプ計量室 — tokens
   ライトを bare :root に置き、ダークは prefers-color-scheme と
   [data-theme="dark"] の両方で再定義する(トグルが両方向で勝つ)。
   系列色は 3 スロットとも all-pairs で CVD / 通常視 / コントラストを通過済み。
   ============================================================ */
:root{
  color-scheme: light;
  --plane:#EFF5F2;
  --surf:#FFFFFF;
  --surf2:#F4F8F6;
  --surf3:#E7EFEB;
  --ink:#122019;
  --ink2:#4A5C54;
  --muted:#78897F;
  --grid:#E2EAE6;
  --base:#C6D3CD;
  --hair:rgba(18,32,25,.09);
  --hair2:rgba(18,32,25,.15);
  --s1:#EA6A1F;   /* 摂取 / 炭水化物 / 体重 */
  --s2:#0FA184;   /* 消費 / タンパク質 */
  --s3:#7048E6;   /* 脂質 / 体脂肪率 */
  --s1-soft:rgba(234,106,31,.13);
  --s2-soft:rgba(15,161,132,.13);
  --s3-soft:rgba(112,72,230,.13);
  --s1-tint:rgba(234,106,31,.07);
  --s2-tint:rgba(15,161,132,.07);
  --s3-tint:rgba(112,72,230,.07);
  --good:#0CA30C; --warn:#FAB219; --crit:#D03B3B;
  --warn-ink:#8A5D00;
  --good-soft:rgba(12,163,12,.13);
  --warn-soft:rgba(250,178,25,.18);
  --crit-soft:rgba(208,59,59,.13);
  --sh1:0 1px 2px rgba(18,32,25,.05);
  --sh2:0 2px 4px rgba(18,32,25,.04),0 14px 30px -16px rgba(18,32,25,.20);
  --sh3:0 8px 24px -8px rgba(18,32,25,.22);
  --r:20px; --r2:14px; --r3:9px;
  --fs:'IBM Plex Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --plane:#101A19; --surf:#1B2A28; --surf2:#233330; --surf3:#2C3E3A;
    --ink:#F2F7F4; --ink2:#B8C8C2; --muted:#8CA09A;
    --grid:#2A3B37; --base:#3A4E49;
    --hair:rgba(242,247,244,.10); --hair2:rgba(242,247,244,.17);
    --s1:#E06C1C; --s2:#10A085; --s3:#7856E6;
    --s1-soft:rgba(224,108,28,.20); --s2-soft:rgba(16,160,133,.20); --s3-soft:rgba(120,86,230,.22);
    --s1-tint:rgba(224,108,28,.10); --s2-tint:rgba(16,160,133,.10); --s3-tint:rgba(120,86,230,.11);
    --warn-ink:#FAB219;
    --good-soft:rgba(12,163,12,.22); --warn-soft:rgba(250,178,25,.20); --crit-soft:rgba(208,59,59,.20);
    --sh1:0 1px 2px rgba(0,0,0,.34);
    --sh2:0 2px 4px rgba(0,0,0,.28),0 14px 30px -16px rgba(0,0,0,.6);
    --sh3:0 8px 24px -8px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#101A19; --surf:#1B2A28; --surf2:#233330; --surf3:#2C3E3A;
  --ink:#F2F7F4; --ink2:#B8C8C2; --muted:#8CA09A;
  --grid:#2A3B37; --base:#3A4E49;
  --hair:rgba(242,247,244,.10); --hair2:rgba(242,247,244,.17);
  --s1:#E06C1C; --s2:#10A085; --s3:#7856E6;
  --s1-soft:rgba(224,108,28,.20); --s2-soft:rgba(16,160,133,.20); --s3-soft:rgba(120,86,230,.22);
  --s1-tint:rgba(224,108,28,.10); --s2-tint:rgba(16,160,133,.10); --s3-tint:rgba(120,86,230,.11);
  --warn-ink:#FAB219;
  --good-soft:rgba(12,163,12,.22); --warn-soft:rgba(250,178,25,.20); --crit-soft:rgba(208,59,59,.20);
  --sh1:0 1px 2px rgba(0,0,0,.34);
  --sh2:0 2px 4px rgba(0,0,0,.28),0 14px 30px -16px rgba(0,0,0,.6);
  --sh3:0 8px 24px -8px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
/* 画面の縮尺を固定する。touch-action:pan-y で縦スクロールだけ許可し、
   ピンチ拡大・ダブルタップ拡大・横方向のパンを止める。
   日付切替の左右スワイプは JS の touch イベントで拾うのでそのまま動く。 */
html{
  overflow-x:hidden; touch-action:pan-y;
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
}
body{
  margin:0; background:var(--plane); color:var(--ink);
  font-family:var(--fs); font-size:15px; line-height:1.6;
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
  overflow-x:hidden; overscroll-behavior:none; touch-action:pan-y;
}
/* 中で横スクロールが要る箇所だけ横方向を戻す */
.chart-wrap,.tblwrap{touch-action:pan-x pan-y}
/* 入力欄のフォーカス時に iOS が勝手に寄せないよう、文字を16px以上に保つ */
input.inp,select.inp,textarea.inp{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2.5px solid var(--s3);outline-offset:2px;border-radius:6px}
::selection{background:var(--s1-soft)}
h1,h2,h3,p{margin:0}
ul{margin:0;padding:0;list-style:none}
.press{transition:transform .12s var(--ease)}
.press:active{transform:scale(.965)}

/* ---------- shell ---------- */
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.rail{display:none}
.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--plane);background:color-mix(in srgb,var(--plane) 84%,transparent);
  -webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);
  border-bottom:1px solid var(--hair);
  display:flex;align-items:center;gap:10px;padding:10px 15px;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:30px;height:30px;flex:none;border-radius:10px;
  background:linear-gradient(140deg,var(--s1),var(--s3) 92%);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;
  letter-spacing:-.02em;box-shadow:var(--sh1);
}
.brand-name{font-weight:700;letter-spacing:.01em;font-size:15px;white-space:nowrap}
.topbar-sp{flex:1}
.iconbtn{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  color:var(--ink2);transition:background .14s,color .14s;
}
.iconbtn:hover{background:var(--surf3);color:var(--ink)}
.iconbtn svg{width:19px;height:19px}

main{flex:1;padding:15px 15px calc(84px + env(safe-area-inset-bottom,0px));max-width:760px;width:100%;margin:0 auto}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--surf);background:color-mix(in srgb,var(--surf) 90%,transparent);
  -webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);
  border-top:1px solid var(--hair);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.tab{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 2px 8px;color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.01em;
  transition:color .14s;position:relative;
}
.tab svg{width:22px;height:22px}
.tab::after{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%) scaleX(0);
  width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--s2);
  transition:transform .18s var(--ease);
}
.tab[aria-current="page"]{color:var(--s2)}
.tab[aria-current="page"]::after{transform:translateX(-50%) scaleX(1)}

@media (min-width:900px){
  .app{flex-direction:row}
  .topbar{display:none}
  .tabbar{display:none}
  .rail{
    display:flex;flex-direction:column;gap:5px;width:226px;flex:none;padding:20px 13px;
    border-right:1px solid var(--hair);background:var(--surf);position:sticky;top:0;height:100vh;height:100dvh;
  }
  .rail .brand{padding:5px 9px 20px}
  .rail-item{
    display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:13px;
    color:var(--ink2);font-size:14.5px;font-weight:600;text-align:left;width:100%;
    transition:background .14s,color .14s;
  }
  .rail-item svg{width:20px;height:20px;flex:none}
  .rail-item:hover{background:var(--surf2);color:var(--ink)}
  .rail-item[aria-current="page"]{background:var(--s2-soft);color:var(--s2)}
  .rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:5px}
  main{padding:28px 32px 64px;max-width:840px}
}

/* ---------- cards ---------- */
.card{
  background:var(--surf);border:1px solid var(--hair);border-radius:var(--r);
  box-shadow:var(--sh2);margin-bottom:13px;overflow:hidden;
}
.card.pop1{background:linear-gradient(168deg,var(--s1-tint),transparent 55%),var(--surf)}
.card.pop2{background:linear-gradient(168deg,var(--s2-tint),transparent 55%),var(--surf)}
.card-h{display:flex;align-items:center;gap:9px;padding:14px 16px 0}
.card-t{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.card-h .sp{flex:1}
.card-b{padding:13px 16px 16px}
.card-b.tight{padding:9px 16px 13px}

.sub{font-size:12.5px;color:var(--muted);line-height:1.55}
.hero-num{
  font-size:52px;font-weight:700;line-height:.98;letter-spacing:-.03em;
  font-variant-numeric:normal;
}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}

/* ---------- day header ---------- */
.dayhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.dayhead .d-main{flex:1;text-align:center;min-width:0}
.d-date{font-size:21px;font-weight:700;letter-spacing:.01em;line-height:1.2}
.d-date .dow{font-size:14px;color:var(--muted);margin-left:6px;font-weight:600}
.d-rel{font-size:12px;color:var(--muted);font-weight:500}
.d-rel button{color:var(--s2);font-weight:700}
.navbtn{
  width:44px;height:44px;flex:none;border-radius:15px;display:grid;place-items:center;
  border:1px solid var(--hair);background:var(--surf);color:var(--ink2);box-shadow:var(--sh1);
  transition:transform .12s var(--ease),color .14s,border-color .14s;
}
.navbtn:hover{color:var(--ink);border-color:var(--hair2)}
.navbtn:active{transform:scale(.92)}
.navbtn svg{width:20px;height:20px}

/* week strip */
.wkstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:13px}
.wkcell{
  min-width:0;overflow:hidden;border:1.5px solid var(--hair);background:var(--surf);border-radius:var(--r2);
  padding:7px 3px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;
  box-shadow:var(--sh1);transition:transform .12s var(--ease),border-color .14s;
}
.wkcell:active{transform:scale(.94)}
.wkcell .wd{font-size:10px;color:var(--muted);font-weight:700}
.wkcell .dd{font-size:15px;font-weight:700;font-family:var(--fm);line-height:1}
.wkcell .meter{width:100%;height:5px;border-radius:3px;background:var(--surf3);overflow:hidden}
.wkcell .meter i{display:block;height:100%;border-radius:3px}
.wkcell[aria-current="date"]{border-color:var(--s2);background:var(--s2-soft)}
.wkcell[aria-current="date"] .wd{color:var(--s2)}
.wkcell.tr .dd{color:var(--s1)}
.wkcell.future{opacity:.5}

/* ---------- balance ---------- */
.bal{display:flex;flex-direction:column;gap:14px}
.bal-top{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.bal-hero{display:flex;flex-direction:column;gap:2px;min-width:0}
.bal-hero .lbl{font-size:11.5px;font-weight:700;letter-spacing:.09em;color:var(--muted)}
.bal-hero .val{display:flex;align-items:baseline;gap:6px}
.bal-hero .unit{font-size:15px;color:var(--muted);font-weight:600}
.bal-side{margin-left:auto;display:flex;gap:18px}
.kv{display:flex;flex-direction:column}
.kv .k{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--muted);display:flex;align-items:center;gap:6px}
.kv .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.kv .v small{font-size:11.5px;color:var(--muted);font-weight:600;margin-left:2px}
.swatch{width:9px;height:9px;border-radius:3px;flex:none}

.divmeter{position:relative;height:40px}
.divmeter .axis{position:absolute;left:50%;top:2px;bottom:2px;width:2px;background:var(--base);border-radius:1px}
.divmeter .row{position:absolute;left:0;right:0;height:15px}
.divmeter .row.a{top:2px} .divmeter .row.b{bottom:2px}
.divmeter .bar{position:absolute;height:15px;border-radius:0 8px 8px 0;box-shadow:var(--sh1)}
.divmeter .bar.l{border-radius:8px 0 0 8px}
.divmeter .tick{position:absolute;top:0;bottom:0;width:2.5px;background:var(--ink);opacity:.55;border-radius:2px}
.divmeter .tlab{position:absolute;font-size:10px;color:var(--muted);white-space:nowrap;font-weight:600}

/* ---------- macro bars ---------- */
.mac{display:flex;flex-direction:column;gap:14px}
.macrow{display:grid;gap:5px}
.macrow .top{display:flex;align-items:baseline;gap:8px;font-size:13px}
.macrow .nm{font-weight:700;display:flex;align-items:center;gap:7px}
.macrow .sp{flex:1}
.macrow .amt{font-family:var(--fm);font-size:14px;font-variant-numeric:tabular-nums;font-weight:600}
.macrow .amt span{color:var(--muted);font-weight:400}
.macrow .rest{font-size:11.5px;color:var(--muted);font-family:var(--fm)}
.track{position:relative;height:12px;background:var(--surf3);border-radius:7px;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;transition:width .34s var(--ease)}
.track .over{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--crit) 0 4px,transparent 4px 8px)}
.track .goal{position:absolute;top:-3px;bottom:-3px;width:2.5px;background:var(--ink);opacity:.4;border-radius:2px}

/* ---------- 入力タイル ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-bottom:11px}
.tile{
  min-width:0;background:var(--surf);border:1.5px solid var(--hair);border-radius:var(--r);
  box-shadow:var(--sh2);padding:14px 9px 12px;
  display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;
  transition:transform .14s var(--ease),border-color .16s,box-shadow .16s;
}
.tile:hover{border-color:var(--c);box-shadow:var(--sh3)}
.tile:active{transform:scale(.955)}
.tile .ic{
  width:46px;height:46px;border-radius:15px;display:grid;place-items:center;
  background:var(--cs);color:var(--c);
}
.tile .ic svg{width:24px;height:24px}
.tile .nm{font-size:13px;font-weight:700;letter-spacing:.01em;line-height:1.3}
.tile .vl{font-size:11.5px;font-family:var(--fm);color:var(--muted);font-weight:500;line-height:1.3}
.tile .vl b{color:var(--ink);font-weight:600}

.minirow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.mini{
  background:var(--surf2);border:1px solid var(--hair);border-radius:var(--r2);
  padding:9px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;
  transition:transform .12s var(--ease),background .14s;
}
.mini:hover{background:var(--surf3)}
.mini:active{transform:scale(.955)}
.mini .k{font-size:10.5px;color:var(--muted);font-weight:700}
.mini .v{font-size:14px;font-weight:700;font-family:var(--fm)}

/* ---------- サブページのヘッダ ---------- */
.subhead{display:flex;align-items:center;gap:9px;margin-bottom:13px}
.subhead .t{flex:1;min-width:0}
.subhead .t b{display:block;font-size:18px;font-weight:700;line-height:1.25}
.subhead .t i{display:block;font-style:normal;font-size:12px;color:var(--muted);font-weight:600}
.backbtn{
  height:44px;padding:0 14px 0 11px;border-radius:15px;display:inline-flex;align-items:center;gap:5px;
  border:1px solid var(--hair);background:var(--surf);color:var(--ink);box-shadow:var(--sh1);
  font-size:13.5px;font-weight:700;transition:transform .12s var(--ease);flex:none;
}
.backbtn:active{transform:scale(.94)}
.backbtn svg{width:18px;height:18px}

/* ---------- bits ---------- */
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;
  font-size:12px;font-weight:700;border:1px solid var(--hair);
  background:var(--surf2);color:var(--ink2);white-space:nowrap;
}
.chip svg{width:13px;height:13px;flex:none}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn-ink);border-color:transparent}
.chip.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.s1{background:var(--s1-soft);color:var(--s1);border-color:transparent}
.chip.s2{background:var(--s2-soft);color:var(--s2);border-color:transparent}
.chip.s3{background:var(--s3-soft);color:var(--s3);border-color:transparent}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 17px;border-radius:14px;font-size:14px;font-weight:700;
  border:1.5px solid var(--hair2);background:var(--surf2);color:var(--ink);
  transition:transform .12s var(--ease),background .14s,filter .14s;
}
.btn:hover{background:var(--surf3)}
.btn:active{transform:scale(.96)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--s2);border-color:var(--s2);color:#fff;box-shadow:var(--sh1)}
.btn.pri:hover{filter:brightness(1.09)}
.btn.acc{background:var(--s1);border-color:var(--s1);color:#fff;box-shadow:var(--sh1)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:11px}
.btn.gh{background:transparent;border-color:var(--hair2)}
.btn.gh:hover{background:var(--surf2)}
.btn.dg{color:var(--crit);border-color:transparent;background:transparent}
.btn.dg:hover{background:var(--crit-soft)}
.btn.blk{width:100%}
.btn.add{border-style:dashed;color:var(--ink2);background:transparent}
.btn.add:hover{color:var(--s2);border-color:var(--s2);background:var(--s2-tint)}

.fld{display:flex;flex-direction:column;gap:5px}
.fld > label{font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--muted)}
.inp{
  width:100%;padding:11px 13px;border-radius:13px;border:1.5px solid var(--hair2);
  background:var(--surf2);color:var(--ink);font-size:15px;transition:border-color .14s,background .14s;
}
.inp:focus{border-color:var(--s2);background:var(--surf);outline:none}
.inp.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.inp.n{text-align:right}
.inp.ro{background:var(--surf3);border-style:dashed;color:var(--ink2)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 49%,var(--muted) 50%),linear-gradient(-45deg,transparent 49%,var(--muted) 50%);background-position:calc(100% - 16px) 53%,calc(100% - 11px) 53%;background-size:6px 6px;background-repeat:no-repeat;padding-right:32px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.empty{text-align:center;padding:18px 10px;color:var(--muted);font-size:12.5px}

/* list items */
.li{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--hair)}
.li:first-child{border-top:none}
.li .body{flex:1;min-width:0}
.li .t1{font-size:14.5px;font-weight:600;overflow-wrap:anywhere;line-height:1.35}
.li .t2{font-size:11.5px;color:var(--muted);font-family:var(--fm)}
.li .r{text-align:right;flex:none}
.li .r .a{font-size:15px;font-weight:700;font-family:var(--fm);font-variant-numeric:tabular-nums}
.li .r .b{font-size:10.5px;color:var(--muted);font-family:var(--fm)}
.li .x{width:31px;height:31px;flex:none;border-radius:10px;display:grid;place-items:center;color:var(--muted);transition:background .14s,color .14s}
.li .x:hover{background:var(--crit-soft);color:var(--crit)}
.li .x.e:hover{background:var(--s2-soft);color:var(--s2)}
.li .x svg{width:15px;height:15px}

/* 区切り見出し。線を「文字の横」ではなく「見出しの上」に置いて、
   セクションの始まりが一目で分かるようにする。 */
.slot-h{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  margin:20px 0 8px;padding-top:15px;border-top:1.5px solid var(--hair);
  font-size:13.5px;font-weight:700;letter-spacing:.01em;color:var(--ink2);
}
.slot-h:first-child{margin-top:2px;padding-top:0;border-top:none}
.slot-h .ln{flex:1;min-width:0}
/* 2つのボタンは1組として扱う。幅が足りないとき片方だけ落ちるのを防ぐ。 */
.slot-h .acts{display:flex;gap:8px;margin-left:auto;flex:none}
.slot-h .kc{font-family:var(--fm);letter-spacing:0;color:var(--ink2);font-weight:600;font-size:12.5px}

/* 食事の区分だけは、さらに強く。色付きのバーと大きめの文字で段を作る。 */
.slot-h.mt{
  font-size:16px;color:var(--ink);gap:10px;
  margin:26px 0 10px;padding-top:17px;border-top-width:2px;
}
.slot-h.mt:first-child{margin-top:0}
.slot-h.mt::before{
  content:"";width:5px;height:19px;border-radius:3px;background:var(--s1);flex:none;
}
.slot-h.mt .kc{
  font-size:13px;color:var(--ink);background:var(--s1-soft);
  padding:3px 10px;border-radius:999px;
}
.slot-h.mt .kc.zero{background:transparent;color:var(--muted);padding-left:0;padding-right:0}
.slot-body{padding-left:15px;border-left:2px solid var(--hair);margin-left:1px}
.slot-body .li:first-child{border-top:none}
.slot-empty{
  padding:9px 0 3px;color:var(--muted);font-size:12.5px;
}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(10,22,20,.46);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:fade .16s ease}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(18px);opacity:.3}}
.sheet{background:var(--surf);width:100%;max-width:580px;max-height:92vh;max-height:92dvh;
  border-radius:24px 24px 0 0;border:1px solid var(--hair);border-bottom:none;
  display:flex;flex-direction:column;animation:rise .22s var(--ease);box-shadow:0 -14px 44px -12px rgba(10,22,20,.45)}
@media (min-width:640px){.scrim{align-items:center;padding:22px}.sheet{border-radius:22px;border-bottom:1px solid var(--hair);max-height:86vh;max-height:86dvh}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:15px 15px 11px;border-bottom:1px solid var(--hair)}
.sheet-h h3{font-size:16px;font-weight:700;flex:1}
.sheet-b{padding:13px 15px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-f{padding:11px 15px calc(13px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--hair);display:flex;gap:9px}
.sheet-f .btn{flex:1}

.srch{position:relative;margin-bottom:9px}
.srch .inp{padding-left:38px}
.srch svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.cands{max-height:min(46dvh,360px);overflow-y:auto;margin:0 -5px}
.cand{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 9px;border-radius:12px;border-top:1px solid var(--hair);transition:background .12s}
.cand:first-child{border-top:none}
.cand:hover{background:var(--surf2)}
.cand .body{flex:1;min-width:0}
.cand .t1{font-size:14px;font-weight:600}
.cand .t2{font-size:11px;color:var(--muted);font-family:var(--fm)}
.cand .tag{font-size:10px;color:var(--muted);border:1px solid var(--hair);padding:2px 7px;border-radius:999px;flex:none;font-weight:600}
.pills{display:flex;gap:7px;flex-wrap:wrap}
.pill{padding:7px 13px;border-radius:999px;border:1.5px solid var(--hair2);font-size:12.5px;font-weight:700;color:var(--ink2);background:var(--surf2);transition:transform .12s var(--ease)}
.pill:active{transform:scale(.94)}
.pill[aria-pressed="true"]{background:var(--s2);border-color:var(--s2);color:#fff}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:8px;align-items:center;margin-bottom:7px}
.setrow .idx{font-family:var(--fm);font-size:12px;color:var(--muted);text-align:center;font-weight:600}

/* ---------- calendar ---------- */
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:13px}
.calhead .t{flex:1;text-align:center;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.caldow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px}
.caldow div{text-align:center;font-size:10.5px;color:var(--muted);font-weight:700}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.calcell{min-height:52px;aspect-ratio:1/1.1;border:1.5px solid var(--hair);background:var(--surf);border-radius:var(--r2);
  padding:6px 5px 5px;display:flex;flex-direction:column;gap:3px;position:relative;text-align:left;
  transition:transform .12s var(--ease),border-color .14s}
.calcell:hover{border-color:var(--hair2)}
.calcell:active{transform:scale(.94)}
.calcell.void{background:transparent;border-color:transparent;pointer-events:none;box-shadow:none}
.calcell .n{font-size:13px;font-weight:700;font-family:var(--fm);line-height:1}
.calcell .kc{font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:var(--muted);font-family:var(--fm);line-height:1.15;margin-top:auto;font-weight:600}
.calcell .bars{display:flex;gap:2.5px;height:16px;align-items:flex-end;margin-top:auto}
.calcell .bars i{flex:1;border-radius:2px 2px 0 0;min-height:1.5px}
.calcell[aria-current="date"]{border-color:var(--s2);background:var(--s2-soft)}
.calcell.sun .n{color:var(--crit)} .calcell.sat .n{color:var(--s3)}
.calcell .dot{position:absolute;right:5px;top:5px;width:6px;height:6px;border-radius:50%}
.calcell.future{opacity:.45}

.mstat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:560px){.mstat{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mstat .b{background:var(--surf2);border-radius:var(--r2);padding:10px 12px}
.mstat .b .k{font-size:11px;color:var(--muted);font-weight:700}
.mstat .b .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.mstat .b .v small{font-size:11.5px;color:var(--muted);font-weight:600}

/* ---------- charts ---------- */
.chart-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.chart{display:block;width:100%;min-width:300px;overflow:visible}
.chart .gridline{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}
.chart .axisline{stroke:var(--base);stroke-width:1.5;shape-rendering:crispEdges}
.chart .tick{fill:var(--muted);font-size:10px;font-family:var(--fm);font-weight:500}
.chart .lbl{fill:var(--ink2);font-size:10.5px;font-family:var(--fm);font-weight:600}
.chart .ser{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .dot{stroke:var(--surf);stroke-width:2.5}
.chart .cross{stroke:var(--ink2);stroke-width:1.5;opacity:.35;shape-rendering:crispEdges}
.chart .hit{fill:transparent}
.chart .tgt{stroke:var(--ink);stroke-width:1.5;opacity:.42;stroke-dasharray:5 4}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin:3px 0 10px}
.legend .it{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);font-weight:600}
.tip{position:absolute;z-index:60;pointer-events:none;background:var(--surf);border:1.5px solid var(--hair2);
  border-radius:13px;box-shadow:var(--sh3);padding:9px 12px;font-size:12.5px;min-width:118px}
.tip .d{font-size:11px;color:var(--muted);font-family:var(--fm);margin-bottom:4px;font-weight:600}
.tip .r{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tip .r .n{display:flex;align-items:center;gap:6px}
.tip .r .v{font-family:var(--fm);font-variant-numeric:tabular-nums;font-weight:600}
.seg{display:inline-flex;background:var(--surf2);border-radius:13px;padding:3px;gap:3px;border:1px solid var(--hair)}
.seg button{padding:7px 15px;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted);transition:background .14s,color .14s}
.seg button[aria-pressed="true"]{background:var(--surf);color:var(--ink);box-shadow:var(--sh1)}

table.dt{width:100%;border-collapse:collapse;font-size:12px}
table.dt th,table.dt td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--hair);font-family:var(--fm);font-variant-numeric:tabular-nums;white-space:nowrap}
table.dt th{color:var(--muted);font-weight:700;font-size:11px;position:sticky;top:0;background:var(--surf)}
table.dt td:first-child,table.dt th:first-child{text-align:left}
.tblwrap{overflow:auto;max-height:330px;border:1px solid var(--hair);border-radius:var(--r2);margin-top:9px}

/* ---------- goal ---------- */
.pace{display:flex;flex-direction:column;gap:10px}
.pacebar{position:relative;height:32px;background:var(--surf3);border-radius:11px;overflow:hidden}
.pacebar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--s2);background:linear-gradient(90deg,var(--s2),color-mix(in srgb,var(--s2) 70%,var(--s3)));border-radius:11px}
.pacebar .txt{position:absolute;inset:0;display:flex;align-items:center;padding:0 12px;font-size:12.5px;font-weight:700;font-family:var(--fm)}
.plan{display:flex;flex-direction:column}
.planrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--hair)}
.planrow:first-child{border-top:none}
.planrow .dd{font-family:var(--fm);font-size:11.5px;color:var(--muted);white-space:nowrap;font-weight:600}
.planrow .nm{font-size:14px;font-weight:600}
.planrow .nm i{display:block;font-style:normal;font-size:11.5px;color:var(--muted);font-weight:500}
.planrow .v{font-family:var(--fm);font-size:13.5px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.menu-day{display:flex;flex-direction:column;gap:2px}

.note{background:var(--surf2);border-left:3px solid var(--s2);border-radius:0 var(--r3) var(--r3) 0;
  padding:11px 13px;font-size:12.5px;color:var(--ink2);line-height:1.7}
.note b{color:var(--ink);font-weight:700}
.note.w{border-left-color:var(--warn);background:var(--warn-soft)}
.note.c{border-left-color:var(--crit);background:var(--crit-soft)}
.note.a{border-left-color:var(--s1);background:var(--s1-tint)}
textarea.inp{resize:vertical;min-height:80px;line-height:1.65}

.kbdhint{font-size:11.5px;color:var(--muted);text-align:center;margin-top:16px}
kbd{font-family:var(--fm);font-size:11px;border:1.5px solid var(--hair2);border-bottom-width:3px;border-radius:6px;padding:1px 5px;background:var(--surf2);font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  z-index:200;background:var(--ink);color:var(--plane);padding:11px 18px;border-radius:999px;
  font-size:13.5px;font-weight:700;box-shadow:var(--sh3);animation:rise .2s var(--ease);white-space:nowrap}
@media(min-width:900px){.toast{bottom:30px}}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>

<script>
/* 起動診断。ここは ES5 だけで書く。古い端末でも必ず動くようにするため、
   新しい構文は一切使わない(この段が動けば「JSは動く」と確定できる)。 */
(function () {
  function mark(id, txt, okFlag) {
    var row = document.getElementById(id);
    if (!row) return;
    var b = row.getElementsByTagName("b")[0];
    if (!b) return;
    b.style.color = okFlag === false ? "#D03B3B" : "#0CA30C";
    b.innerHTML = "";
    b.appendChild(document.createTextNode(txt));
  }
  window.__step = mark;

  window.__fatal = function (msg, where) {
    var box = document.getElementById("berr");
    if (!box) return;
    box.style.display = "block";
    box.innerHTML = "";
    box.appendChild(document.createTextNode(String(msg) + (where ? "\n" + where : "")));
  };

  window.onerror = function (msg, src, line, col) {
    window.__fatal(msg, (src || "") + " " + (line || "") + "行" + (col ? ":" + col : ""));
    return false;
  };
  window.addEventListener("unhandledrejection", function (e) {
    var r = e.reason;
    window.__fatal("Promise: " + ((r && r.message) || r), "");
  });

  /* iOS Safari は user-scalable=no を無視するので、拡大の入り口を塞ぐ。
     gesture* は iOS 独自、touchmove の2本指はその保険。 */
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener("touchmove", function (e) {
    if (e.touches && e.touches.length > 1) e.preventDefault();
  }, { passive: false });
  /* ダブルタップ拡大よけ(300ms以内の2回目のタップを無効化) */
  var lastTap = 0;
  document.addEventListener("touchend", function (e) {
    var now = Date.now();
    if (now - lastTap < 300) e.preventDefault();
    lastTap = now;
  }, { passive: false });

  mark("b2", "OK");
  var ua = document.getElementById("bua");
  if (ua) ua.appendChild(document.createTextNode(navigator.userAgent));
})();
</script>

<script>
"use strict";
/* ==========================================================================
   リコンプ計量室 — engine
   Energy model:
     消費 = 基礎代謝 x 生活係数 + 歩数(net) + 傾斜ウォーク(net)

/* ------------------------------------------------------------------ dates */
const P2 = n => String(n).padStart(2, "0");
const key = d => `${d.getFullYear()}-${P2(d.getMonth() + 1)}-${P2(d.getDate())}`;
const parse = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const addD = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return key(d); };
const diffD = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const TODAY = key(new Date());
/* 目標日・開始日が空(公開版の初期状態や全削除の直後)なら、開いた日を基準に埋める。
   ここが空のまま目標画面を開くと日付計算が NaN になるため、状態を作り直す箇所では必ず通す。 */
function normalizeGoal() {
  if (!S.goal.startDate) S.goal.startDate = TODAY;
  if (!S.goal.date) S.goal.date = addD(TODAY, 60);
  if (!S.set.birth) S.set.birth = "1995-01-01";
  if (!(S.set.height > 0)) S.set.height = 170;
}
normalizeGoal();
const DOW = ["日", "月", "火", "水", "木", "金", "土"];
const dowOf = k => parse(k).getDay();
/* 週は月曜始まり */
const weekStart = k => addD(k, -((dowOf(k) + 6) % 7));
const monthStart = k => k.slice(0, 8) + "01";
function ageAt(birth, at) {
  const b = parse(birth), d = parse(at || TODAY);
  let a = d.getFullYear() - b.getFullYear();
  const m = d.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && d.getDate() < b.getDate())) a--;
  return a;
}

/* ------------------------------------------------------------------ utils */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const r0 = n => Math.round(n || 0);
const r1 = n => Math.round((n || 0) * 10) / 10;
const cl = (v, a, b) => Math.max(a, Math.min(b, v));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const sgn = n => (n > 0 ? "+" : n < 0 ? "−" : "±");
const abs0 = n => r0(Math.abs(n)).toLocaleString("ja-JP");
const signed = n => sgn(n) + abs0(n);
const fmt = n => r0(n).toLocaleString("ja-JP");

function toast(msg) {
  const h = document.getElementById("toastHost");
  h.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { h.innerHTML = ""; }, 2100);
}

/* ------------------------------------------------------------- day record */
function blank() { return { w: null, bf: null, steps: 0, inc: [], meals: [], lifts: [], acts: [], td: null, trainMin: 0, note: "" }; }
function day(k) {
  const d = S.days[k];
  if (!d) return blank();
  return Object.assign(blank(), d);
}
let DATA_STAMP = 0;
function edit(k, fn) {
  if (!S.days[k]) S.days[k] = blank();
  fn(S.days[k]);
  S.days[k].u = Date.now();
  DATA_STAMP++;
  save();
}
const hasData = d => !!(d.meals.length || d.lifts.length || d.acts.length || d.inc.length || d.steps || d.w != null || d.bf != null || d.note);

/* 体重: その日の記録 → 直近の過去記録 → 開始体重 */
function weightAt(k) {
  const d = S.days[k];
  if (d && d.w) return d.w;
  const ks = Object.keys(S.days).filter(x => S.days[x].w && x <= k).sort();
  if (ks.length) return S.days[ks[ks.length - 1]].w;
  const fu = Object.keys(S.days).filter(x => S.days[x].w).sort();
  if (fu.length) return S.days[fu[0]].w;
  return S.goal.startW || 70;
}

/* -------------------------------------------------------------- 消費モデル */
function bmrOf(w, at) {
  const st = S.set;
  if (st.bmrManual > 0) return st.bmrManual;
  const age = ageAt(st.birth, at), h = st.height;
  if (st.bmrF === "ganpule") {
    const c = st.sex === "m" ? 0.4235 : 0.9708;
    return ((0.0481 * w + 0.0234 * h - 0.0138 * age - c) * 1000) / 4.186;
  }
  return 10 * w + 6.25 * h - 5 * age + (st.sex === "m" ? 5 : -161);
}
/* 速度は内部では m/s で持つ(ACSM式がその単位のため)。
   画面での入出力は km/h に変換する。既存の記録もそのまま読める。 */
const kmh2ms = k => num(k) / 3.6;
const ms2kmh = m => num(m) * 3.6;
/* km/h からキロあたりのペース("5:00" 形式)を作る */
function paceStr(kmh) {
  const k = num(kmh);
  if (k <= 0) return "—";
  const t = 60 / k, m = Math.floor(t), sec = Math.round((t - m) * 60);
  return sec === 60 ? `${m + 1}:00` : `${m}:${P2(sec)}`;
}
/* ACSM: 速度は m/s、勾配は小数(0.10 = 10%) */
const vo2Walk = (ms, g) => 0.1 * (ms * 60) + 1.8 * (ms * 60) * g + 3.5;
const vo2Run = (ms, g) => 0.2 * (ms * 60) + 0.9 * (ms * 60) * g + 3.5;
/* kcal/min = VO2 x kg / 200。安静(3.5)を引いて純消費にする */
const kcalVo2 = (vo2, w, min) => Math.max(0, ((vo2 - 3.5) * w * min) / 200);
const kcalMet = (met, w, min) => Math.max(0, ((met - 1) * 3.5 * w * min) / 200);
const walkCad = ms => cl(100 + 30 * (ms - 1.0), 88, 142);

function incCalc(e, w) {
  const g = num(e.g) / 100, ms = num(e.sp), min = num(e.min);
  const run = ms >= 2.0;
  const vo2 = run ? vo2Run(ms, g) : vo2Walk(ms, g);
  return {
    kcal: kcalVo2(vo2, w, min), met: vo2 / 3.5, run,
    steps: Math.round((run ? 168 : walkCad(ms)) * min),
    dist: (ms * 60 * min) / 1000
  };
}
function actSteps(a) {
  if (!a.amb) return 0;
  const spm = a.met >= 8 ? 165 : a.met >= 6 ? 145 : 115;
  return Math.round(spm * num(a.min));
}
/* セット間の休憩は種目によってまるで違う。スクワットやデッドリフトで
   3分休むのと、サイドレイズで45秒しか休まないのを同じ90秒で計算すると、
   高重量の多関節種目が大きく過小評価になる。強度の段階で倍率をかける。 */
function restFactor(met) {
  if (met >= 7.5) return 0.9;   /* 自重の高強度・サーキット系はインターバルが短い */
  if (met >= 6) return 2.0;     /* 高重量の多関節(スクワット/デッド/クリーン) */
  if (met >= 4.5) return 1.35;  /* 通常の多関節(ベンチ/ロウ/プレス) */
  return 0.7;                   /* 単関節(カール/レイズ/エクステンション) */
}
function liftCalc(l, w) {
  const sets = l.sets || [];
  const reps = sets.reduce((a, s) => a + num(s.rep), 0);
  /* 所要時間はレップ数から見積もる。28レップのセットと8レップのセットでは
     かかる時間がまるで違うので、セット数だけで一律に換算すると高レップが過小評価になる。 */
  const rest = S.set.restSec * restFactor(l.met);
  const min = num(l.min) || (reps * S.set.repSec + sets.length * rest) / 60;
  /* ダンベル・ケトルベルは片手の重量で入力するのが普通なので、
     ボリュームは左右合計(×2)にする。ゴブレット等の片方だけ持つ種目は ph=0 にする。 */
  const mult = l.ph ? 2 : 1;
  return {
    min, reps, mult, rest, kcal: kcalMet(l.met, w, min),
    vol: sets.reduce((a, s) => a + num(s.kg) * num(s.rep), 0) * mult,
    orm: sets.reduce((a, s) => Math.max(a, num(s.rep) ? num(s.kg) * (1 + num(s.rep) / 30) : 0), 0)
  };
}

function calc(k) {
  const d = day(k), w = weightAt(k);
  let kcal = 0, p = 0, f = 0, cb = 0, salt = 0;
  for (const m of d.meals) { kcal += num(m.kcal); p += num(m.p); f += num(m.f); cb += num(m.cb); salt += num(m.s); }

  const bmr = bmrOf(w, k), base = bmr * S.set.life;
  let incK = 0, incSteps = 0, incMin = 0, incDist = 0;
  for (const e of d.inc) { const r = incCalc(e, w); incK += r.kcal; incSteps += r.steps; incMin += num(e.min); incDist += r.dist; }
  let liftK = 0, vol = 0, liftMin = 0, liftReps = 0;
  const lr = d.lifts.map(l => liftCalc(l, w));
  const estMin = lr.reduce((a, r) => a + r.min, 0);
  /* 実測時間を入れた場合は見積もりをその比率で補正する(いちばん正確) */
  const tScale = num(d.trainMin) > 0 && estMin > 0 ? num(d.trainMin) / estMin : 1;
  for (const r of lr) { liftK += r.kcal * tScale; vol += r.vol; liftMin += r.min * tScale; liftReps += r.reps; }
  let actK = 0, aSteps = 0, actMin = 0;
  for (const a of d.acts) { actK += kcalMet(num(a.met), w, num(a.min)); aSteps += actSteps(a); actMin += num(a.min); }

  /* 歩数の二重計上補正: 傾斜ウォークと歩行系の運動で稼いだ推定歩数を引く */
  const dup = incSteps + aSteps;
  const eff = Math.max(0, num(d.steps) - dup);
  const stepMin = eff / S.set.cadence;
  const stepK = kcalVo2(vo2Walk(S.set.stepSpeed, 0), w, stepMin);

  const tef = S.set.tef ? kcal * 0.1 : 0;
  const burn = base + stepK + incK + liftK + actK + tef;
  return {
    w, bmr, base, kcal, p, f, cb, salt,
    stepK, incK, liftK, actK, tef, burn, net: kcal - burn,
    rawSteps: num(d.steps), dup, eff, stepMin, incSteps, aSteps,
    vol, liftMin, liftReps, actMin, incMin, incDist, trainMin: num(d.trainMin), estMin,
    isTrain: d.td == null ? d.lifts.length > 0 : !!d.td,
    logged: hasData(d)
  };
}

/* 直近の記録から「トレ日の消費 − オフ日の消費」を測る。
   サンプルが足りないうちは null を返し、設定値を使う。
   plan() から毎回呼ばれるので、記録が変わるまでは結果を使い回す。 */
let _mbCache = null, _mbStamp = -1;
function measuredBonus() {
  if (_mbStamp === DATA_STAMP) return _mbCache;
  const ks = Object.keys(S.days).filter(k => k <= TODAY).sort().slice(-28);
  let tS = 0, tN = 0, rS = 0, rN = 0;
  for (const k of ks) {
    const c = calc(k);
    if (!c.logged) continue;
    if (c.isTrain) { tS += c.burn; tN++; } else { rS += c.burn; rN++; }
  }
  _mbCache = (tN >= 3 && rN >= 2) ? { diff: tS / tN - rS / rN, tN, rN } : null;
  _mbStamp = DATA_STAMP;
  return _mbCache;
}

/* -------------------------------------------------------------- 目標モデル */
function goalDays() { return Math.max(1, diffD(TODAY, S.goal.date)); }
/* 目標体重と期日から必要な赤字を出し、それを「食事を減らす分」と
   「運動を増やす分」に配分する。目標消費・目標摂取はどちらもここから決まるので、
   目標体重や日付を変えると両方が自動で動く。
       目標消費 = 維持カロリー + 赤字×運動割合
       目標摂取 = 目標消費 − 赤字                                        */
function plan(k) {
  const g = S.goal, w = weightAt(k || TODAY);
  const out = {
    w, maint: g.tdee, deficit: 0, burn: g.tdee, kcal: g.tdee,
    share: cl(g.actShare == null ? 0.3 : g.actShare, 0, 0.8),
    fromFood: 0, fromMove: 0, floorHit: false,
    p: 0, f: 0, c: 0, cTrain: 0, cRest: 0, capped: false, days: goalDays(), kgLeft: 0
  };
  out.p = g.pKg * w; out.f = g.fKg * w;
  if (g.on) {
    out.kgLeft = Math.max(0, w - g.targetW);
    out.deficit = (out.kgLeft * 7200) / out.days;
    /* 安全上限: 体重の1.2%/週 */
    const cap = (w * 0.012 * 7200) / 7;
    if (out.deficit > cap) { out.deficit = cap; out.capped = true; }
  }
  out.fromMove = out.deficit * out.share;
  out.fromFood = out.deficit - out.fromMove;
  out.burn = out.maint + out.fromMove;

  /* 摂取の下限(P・F・炭水化物の最低量)を割る場合は、足りない赤字を消費側に回す */
  const floor = out.p * 4 + out.f * 9 + g.cMinKg * w * 4;
  out.kcal = out.burn - out.deficit;
  if (out.kcal < floor) {
    out.kcal = floor;
    out.floorHit = true;
    out.burn = out.kcal + out.deficit;
    out.fromMove = out.burn - out.maint;
    out.fromFood = out.deficit - out.fromMove;
  }
  out.c = Math.max(g.cMinKg * w, (out.kcal - out.p * 4 - out.f * 9) / 4);
  /* 目標消費をトレ日とオフ日に振り分ける。差は trainBonus、週の平均は out.burn のまま。
       burnTrain - burnRest = trainBonus
       td*burnTrain + (7-td)*burnRest = 7*burn                                  */
  const td = cl(g.trainDays, 0, 7);
  const mb = (g.bonusAuto == null ? 1 : g.bonusAuto) ? measuredBonus() : null;
  const bonus = mb ? cl(mb.diff, 0, 1500) : Math.max(0, g.trainBonus == null ? 300 : g.trainBonus);
  out.bonus = bonus; out.td = td; out.mb = mb;
  out.bonusSrc = mb ? `実績 (トレ${mb.tN}日 / オフ${mb.rN}日の平均)` : "設定値";
  if (td > 0 && td < 7) {
    out.burnTrain = out.burn + (bonus * (7 - td)) / 7;
    out.burnRest = out.burn - (bonus * td) / 7;
  } else { out.burnTrain = out.burn; out.burnRest = out.burn; }

  /* 摂取は「その日の消費 − 赤字」で出す。これで 1日の± が毎日同じになり、
     よく動いた日ほど食べられる。炭水化物の差は自動的に trainBonus/4 グラムになる。 */
  const fixedK = out.p * 4 + out.f * 9;        /* P と F は毎日同じ */
  const floorK = fixedK + g.cMinKg * w * 4;    /* 摂取の下限 */
  out.kcalTrain = out.burnTrain - out.deficit;
  out.kcalRest = out.burnRest - out.deficit;
  /* 下限を割る日は、足りない赤字を消費側に回して ± を保つ */
  if (out.kcalTrain < floorK) { out.kcalTrain = floorK; out.burnTrain = floorK + out.deficit; out.floorHit = true; }
  if (out.kcalRest < floorK) { out.kcalRest = floorK; out.burnRest = floorK + out.deficit; out.floorHit = true; }
  out.cTrain = (out.kcalTrain - fixedK) / 4;
  out.cRest = (out.kcalRest - fixedK) / 4;
  /* 週の平均は実際の配分から取り直す(下限で持ち上がったときに整合させる) */
  if (td > 0 && td < 7) {
    out.burn = (td * out.burnTrain + (7 - td) * out.burnRest) / 7;
    out.kcal = (td * out.kcalTrain + (7 - td) * out.kcalRest) / 7;
    out.c = (td * out.cTrain + (7 - td) * out.cRest) / 7;
  } else { out.burn = out.burnTrain; out.kcal = out.kcalTrain; out.c = out.cTrain; }
  out.fromMove = out.burn - out.maint;
  out.fromFood = out.deficit - out.fromMove;
  return out;
}
/* その日の目標(トレ日/オフ日でカーボが変わる) */
function dayTarget(k) {
  const pl = plan(k), tr = calc(k).isTrain;
  return {
    p: pl.p, f: pl.f,
    c: tr ? pl.cTrain : pl.cRest,
    kcal: tr ? pl.kcalTrain : pl.kcalRest,
    burn: tr ? pl.burnTrain : pl.burnRest,
    isTrain: tr, pl
  };
}

/* --------------------------------------------------------- 週次カロリー精算 */
function weekBudget(k) {
  const ws = weekStart(k), days = [];
  for (let i = 0; i < 7; i++) days.push(addD(ws, i));
  const we = days[6];
  /* 基準日: 今週なら今日、未来の週なら見ている日、終わった週なら週末で締める */
  let cur, past = false;
  if (TODAY < ws) cur = k;
  else if (TODAY > we) { cur = we; past = true; }
  else cur = TODAY;

  let tk = 0, tp = 0, tf = 0, tc = 0;     /* 週の目標合計 */
  let ak = 0, ap = 0, af = 0, ac = 0;     /* 基準日より前の消化ぶん */
  let fk = 0, fp = 0, ff = 0, fc = 0;     /* 週全体の実績 */
  let todayA = null, rem = 0;
  for (const d of days) {
    const t = dayTarget(d), c = calc(d);
    tk += t.kcal; tp += t.p; tf += t.f; tc += t.c;
    if (c.logged) { fk += c.kcal; fp += c.p; ff += c.f; fc += c.cb; }
    if (d < cur) {
      /* 記録が無い過去日は目標どおり食べたものとして扱う(過大な調整を防ぐ) */
      if (c.logged) { ak += c.kcal; ap += c.p; af += c.f; ac += c.cb; }
      else { ak += t.kcal; ap += t.p; af += t.f; ac += t.c; }
    } else rem++;
    if (d === cur) todayA = c;
  }
  rem = Math.max(1, rem);
  const per = { kcal: (tk - ak) / rem, p: (tp - ap) / rem, f: (tf - af) / rem, c: (tc - ac) / rem };
  const base = dayTarget(cur);
  return {
    ws, we, days, cur, rem, per, base, todayA, past,
    adj: { kcal: per.kcal - base.kcal, p: per.p - base.p, f: per.f - base.f, c: per.c - base.c },
    tgt: { kcal: tk, p: tp, f: tf, c: tc },
    act: { kcal: fk, p: fp, f: ff, c: fc }
  };
}

function search(list, q, keyf, lim) {
  const t = normKana(q);
  const cap = lim || 60;
  if (!t) return list.slice(0, cap);
  /* 元の語 + 読みを置き換えた語で引いて、重複を除いて前方一致優先で並べる */
  const terms = [t];
  for (const [kana, kanji] of SYN) {
    if (t.includes(kana)) {
      const alt = normKana(t.replace(kana, kanji));
      if (alt && !terms.includes(alt)) terms.push(alt);
    }
  }
  const seen = new Set(), out = [];
  terms.forEach((term, ti) => {
    for (const o of list) {
      if (seen.has(o)) continue;
      const i = normKana(keyf(o)).indexOf(term);
      if (i >= 0) { seen.add(o); out.push([ti * 1000 + i, o]); }
    }
  });
  out.sort((a, b) => a[0] - b[0]);
  return out.slice(0, cap).map(x => x[1]);
}
