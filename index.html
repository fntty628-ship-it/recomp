  <p class="kbdhint">キーボード <kbd>←</kbd><kbd>→</kbd> で日を移動 · <kbd>T</kbd> で今日 · スマホは左右スワイプ</p>`;
}

/* ------------------------------------------------- 入力サブページの共通ヘッダ */
function subHead(title, sub) {
  const dd = parse(CUR), dw = dowOf(CUR);
  return `<div class="subhead">
    <button class="backbtn press" data-act="back">${IC.L}戻る</button>
    <div class="t"><b>${esc(title)}</b>
      <i>${dd.getMonth() + 1}月${dd.getDate()}日(${DOW[dw]})${CUR === TODAY ? " · 今日" : ""} · ${esc(sub)}</i></div>
  </div>`;
}
function macChips(c, t) {
  const one = (n, v, tg, col) => `<span class="chip" style="background:${col};border-color:transparent">
    ${n} <b class="mono">${r0(v)}</b><span style="opacity:.7">/${r0(tg)}g</span></span>`;
  return `<div class="row wrap" style="gap:7px">
    <span class="chip ${c.kcal > t.kcal + 60 ? "crit" : "s1"}"><b class="mono">${fmt(c.kcal)}</b> / ${fmt(t.kcal)} kcal</span>
    ${one("P", c.p, t.p, "var(--s2-soft)")}
    ${one("F", c.f, t.f, "var(--s3-soft)")}
    ${one("C", c.cb, t.c, "var(--s1-soft)")}
  </div>`;
}

/* ============================================================ 食事入力ページ */
function vMeal() {
  const c = calc(CUR), d = day(CUR), t = dayTarget(CUR);
  return subHead("食事入力", `${d.meals.length}品 · ${fmt(c.kcal)} kcal`) + `
  <div class="card pop1"><div class="card-b">
    ${macChips(c, t)}
    <div class="sub" style="margin-top:9px">残り カロリー ${r0(Math.max(0, t.kcal - c.kcal))} kcal · P ${r0(Math.max(0, t.p - c.p))}g · F ${r0(Math.max(0, t.f - c.f))}g · C ${r0(Math.max(0, t.c - c.cb))}g${c.salt ? ` / 食塩 ${r1(c.salt)}g` : ""}</div>
  </div></div>
  ${mealCard(d, c)}
  <button class="btn pri blk press" data-act="back" style="margin-top:4px">${IC.ok}完了</button>`;
}

/* ==================================================== トレーニング入力ページ */
function vTrain() {
  const c = calc(CUR), d = day(CUR);
  const best = {};
  for (const l of d.lifts) { const r = liftCalc(l, c.w); if (r.orm > (best[l.n] || 0)) best[l.n] = r.orm; }
  return subHead("トレーニング入力", `${d.lifts.length}種目 · ${fmt(c.vol)} kg`) + `
  <div class="card pop2"><div class="card-b">
    <div class="row wrap" style="gap:7px">
      <span class="chip s3"><b class="mono">${fmt(c.vol)}</b> kg 総ボリューム</span>
      <span class="chip"><b class="mono">${c.liftReps}</b> レップ</span>
      <span class="chip"><b class="mono">${r0(c.liftMin)}</b> 分</span>
      <span class="chip s2"><b class="mono">${fmt(c.liftK)}</b> kcal</span>
      <span class="chip ${c.isTrain ? "s1" : ""}">${c.isTrain ? "トレ日" : "オフ日"}</span>
      <button class="btn sm gh" data-act="toggleTd">切替</button>
    </div>
    <div class="grid2" style="margin-top:11px">
      <div class="fld"><label for="tmIn">実際のトレ時間 (分)</label>
        <input id="tmIn" class="inp mono n" type="number" inputmode="numeric" step="5" min="0"
          value="${d.trainMin || ""}" placeholder="見込み ${r0(c.estMin)}" data-in="trainMin"></div>
      <div class="fld"><label>消費カロリー</label>
        <div class="inp mono n ro">${fmt(c.liftK)} kcal</div></div>
    </div>
    <div class="note" style="margin-top:10px">
      消費は<b>METs × 時間 × 体重</b>で出しています。所要時間はレップ数から見積もっていますが、
      <b>実際にかかった時間を入れるといちばん正確</b>になります(その時間に合わせて全体を補正します)。
      重量を変えても消費が変わらないのは、この式に重量が入らないためです。挙げた重量は<b>総ボリューム</b>のほうで効いてきます。
    </div>
  </div></div>
  ${liftCard(d, c)}
  ${Object.keys(best).length ? `<div class="card"><div class="card-h"><span class="card-t">この日の推定1RM</span></div>
    <div class="card-b tight">${Object.keys(best).map(n => `<div class="li">
      <div class="body"><div class="t1">${esc(n)}</div></div>
      <div class="r"><div class="a">${r1(best[n])}</div><div class="b">kg</div></div></div>`).join("")}</div></div>` : ""}
  <button class="btn pri blk press" data-act="back" style="margin-top:4px">${IC.ok}完了</button>`;
}

/* ==================================================== 運動・歩数入力ページ */
function vMove() {
  const c = calc(CUR), d = day(CUR);
  return subHead("運動・歩数入力", `${c.rawSteps.toLocaleString("ja-JP")}歩 · ${fmt(c.stepK + c.incK + c.actK)} kcal`) + `
  <div class="card pop2"><div class="card-b">
    <div class="row wrap" style="gap:7px">
      <span class="chip s2"><b class="mono">${fmt(c.stepK + c.incK + c.actK)}</b> kcal</span>
      <span class="chip"><b class="mono">${c.eff.toLocaleString("ja-JP")}</b> 純歩数</span>
      ${c.incMin ? `<span class="chip s1">傾斜 ${r0(c.incMin)}分</span>` : ""}
      ${c.actMin ? `<span class="chip s3">運動 ${r0(c.actMin)}分</span>` : ""}
    </div>
  </div></div>
  ${stepCard(d, c)}
  ${actCard(d, c)}
  <button class="btn pri blk press" data-act="back" style="margin-top:4px">${IC.ok}完了</button>`;
}

function macRow(name, v, tgt, col, unit) {
  const over = tgt > 0 && v > tgt;
  /* 超過ぶんはバーの内側に縞で重ねる。以前は目盛りの外側に描いていて
     枠の overflow:hidden に隠れ、超過が一切見えなかった。 */
  const ex = over ? cl(((v - tgt) / v) * 100, 0, 100) : 0;
  const pct = tgt > 0 ? cl((v / tgt) * 100, 0, 100) : 0;
  const goalPos = over ? 100 - ex : 100;   /* 目標位置の印 */
  return `<div class="macrow">
    <div class="top"><span class="nm">${SW(col)}${name}</span><span class="sp"></span>
      <span class="amt"><b>${r0(v)}</b><span> / ${r0(tgt)}${unit}</span></span></div>
    <div class="track">
      <i style="width:${pct}%;background:${col}"></i>
      ${over ? `<span class="over" style="left:${goalPos}%;width:${ex}%"></span>` : ""}
      <span class="goal" style="left:calc(${goalPos}% - 1px)"></span>
    </div>
    <div class="rest">${over ? `<b style="color:var(--crit)">${r0(v - tgt)}${unit} 超過</b>` : `残り ${r0(tgt - v)}${unit}`}</div>
  </div>`;
}
/* 週次カロリー精算カード */
function weekCard(wb) {
  const wsL = wb.ws.slice(5).replace("-", "/"), weL = wb.we.slice(5).replace("-", "/");
  if (wb.past) {
    const row = (n, a, t, u) => {
      const d = a - t, cls = Math.abs(d) < (u === "kcal" ? 400 : 40) ? "" : d > 0 ? "crit" : "warn";
      return `<div class="planrow"><span class="dd">${n}</span>
        <span class="nm"><b class="mono">${fmt(a)}</b> <span style="color:var(--muted);font-size:12px">/ ${fmt(t)} ${u}</span></span>
        <span class="v"><span class="chip ${cls}">${signed(d)}${u}</span></span></div>`;
    };
    return `<div class="card">
      <div class="card-h"><span class="card-t">この週の精算</span><span class="sp"></span>
        <span class="chip">${wsL} – ${weL} · 終了</span></div>
      <div class="card-b">
        <div class="plan">
          ${row("カロリー", wb.act.kcal, wb.tgt.kcal, "kcal")}
          ${row("タンパク質", wb.act.p, wb.tgt.p, "g")}
          ${row("脂質", wb.act.f, wb.tgt.f, "g")}
          ${row("炭水化物", wb.act.c, wb.tgt.c, "g")}
        </div>
      </div></div>`;
  }
  const a = wb.todayA || { kcal: 0, p: 0, f: 0, cb: 0 };
  const row = (n, per, adj, left, u) => {
    const cls = Math.abs(adj) < (u === "kcal" ? 40 : 5) ? "" : adj < 0 ? "crit" : "good";
    return `<div class="planrow">
      <span class="dd">${n}</span>
      <span class="nm"><b class="mono">${r0(per)}</b> <span style="color:var(--muted);font-size:12px">${u}/日</span>
        <i>今日あと ${left > 0 ? r0(left) + u : "0" + u + "(達成)"}</i></span>
      <span class="v"><span class="chip ${cls}">${adj < 0 ? IC.dn : adj > 0 ? IC.up : ""}${signed(adj)}${u}</span></span>
    </div>`;
  };
  const big = Math.abs(wb.adj.c) > 25 || Math.abs(wb.adj.kcal) > 200;
  return `<div class="card">
    <div class="card-h"><span class="card-t">週の残り配分</span><span class="sp"></span>
      <span class="chip">${wsL} – ${weL} · 残り${wb.rem}日</span></div>
    <div class="card-b">
      <div class="note ${big ? "w" : ""}">
        ${big ? IC.warn + " " : ""}週の合計目標に対して、<b>${wb.cur === TODAY ? "今日から" : "この日から"}残り${wb.rem}日</b>は1日あたりこの配分に寄せると週で帳尻が合います。
      </div>
      <div class="plan" style="margin-top:8px">
        ${row("カロリー", wb.per.kcal, wb.adj.kcal, wb.per.kcal - a.kcal, "kcal")}
        ${row("タンパク質", wb.per.p, wb.adj.p, wb.per.p - a.p, "g")}
        ${row("脂質", wb.per.f, wb.adj.f, wb.per.f - a.f, "g")}
        ${row("炭水化物", wb.per.c, wb.adj.c, wb.per.c - a.cb, "g")}
      </div>
    </div>
  </div>`;
}

/* ------------------------------------------------------------------ 食事 */
const SLOTS = [["b", "朝食"], ["l", "昼食"], ["d", "夕食"], ["s", "間食・その他"]];
function mealCard(d, c) {
  return `<div class="card">
    <div class="card-h"><span class="card-t">食事</span><span class="sp"></span>
      <span class="sub mono">${fmt(c.kcal)} kcal · P${r0(c.p)} F${r0(c.f)} C${r0(c.cb)}</span></div>
    <div class="card-b tight">
      ${SLOTS.map(([sk, sn]) => {
    const items = d.meals.map((m, i) => [m, i]).filter(([m]) => (m.slot || "s") === sk);
    const sub = items.reduce((a, [m]) => a + num(m.kcal), 0);
    return `<div class="slot-h mt">${sn}
        <span class="kc${sub ? "" : " zero"}">${sub ? fmt(sub) + " kcal" : "未入力"}</span>
        <span class="ln"></span>
        <span class="acts">
          <button class="btn sm add" data-act="addFood" data-slot="${sk}">${IC.plus}検索</button>
          <button class="btn sm add" data-act="quickFood" data-slot="${sk}">${IC.plus}kcal</button>
        </span></div>
      ${items.length ? `<div class="slot-body">${items.map(([m, i]) => `<div class="li">
          <div class="body"><div class="t1">${esc(m.n)}</div>
            <div class="t2">${esc(m.q || r0(m.g) + "g")} · P${r1(m.p)} F${r1(m.f)} C${r1(m.cb)}</div></div>
          <div class="r"><div class="a">${fmt(m.kcal)}</div><div class="b">kcal</div></div>
          <button class="x" data-act="delMeal" data-i="${i}" aria-label="${esc(m.n)}を削除">${IC.x}</button>
        </div>`).join("")}</div>` : ""}`;
  }).join("")}
      <div class="row wrap" style="margin-top:12px;gap:8px">
        <button class="btn sm gh" data-act="mySets">マイセット</button>
        <button class="btn sm gh" data-act="newMyFood">マイ食品を登録</button>
      </div>
    </div>
  </div>`;
}

/* ------------------------------------------------------------------ 歩数 */
function stepCard(d, c) {
  return `<div class="card">
    <div class="card-h"><span class="card-t">歩数・傾斜ウォーク</span><span class="sp"></span>
      <span class="sub mono">${fmt(c.stepK + c.incK)} kcal</span></div>
    <div class="card-b">
      <div class="grid2">
        <div class="fld"><label for="stIn">歩数(万歩計の値)</label>
          <input id="stIn" class="inp mono n" type="number" inputmode="numeric" min="0" step="100" value="${d.steps || ""}" placeholder="0" data-in="steps"></div>
        <div class="fld"><label>純歩数(補正後)</label>
          <div class="inp mono n" style="background:var(--surf3);border-style:dashed">${c.eff.toLocaleString("ja-JP")}</div></div>
      </div>
      ${c.dup ? `<div class="note w" style="margin-top:9px">${IC.warn} 傾斜ウォーク・歩行系の運動で <b>約${c.dup.toLocaleString("ja-JP")}歩</b>ぶんが重複するため差し引いています(ランニング等の二重計上防止)。</div>` : ""}
      <div class="slot-h">傾斜ウォーク<span class="ln"></span>
        <button class="btn sm add" data-act="addInc">${IC.plus}追加</button></div>
      ${d.inc.length ? d.inc.map((e, i) => {
    const r = incCalc(e, c.w), kmh = r1(ms2kmh(e.sp));
    return `<div class="li">
          <div class="body"><div class="t1">勾配 ${r1(e.g)}% · ${kmh} km/h · ${r0(e.min)}分</div>
            <div class="t2">キロ${paceStr(kmh)} · ${r1(r.dist)} km · ${r1(r.met)} METs · 推定${r.steps.toLocaleString("ja-JP")}歩${r.run ? " · 走行式" : ""}</div></div>
          <div class="r"><div class="a">${fmt(r.kcal)}</div><div class="b">kcal</div></div>
          <button class="x" data-act="delInc" data-i="${i}" aria-label="削除">${IC.x}</button>
        </div>`;
  }).join("") : '<div class="empty">テクノジムの表示値(勾配%・速度km/h)をそのまま入れてください</div>'}
    </div>
  </div>`;
}

/* -------------------------------------------------------------- 筋トレ */
function liftCard(d, c) {
  return `<div class="card">
    <div class="card-h"><span class="card-t">トレーニング</span><span class="sp"></span>
      <span class="sub mono">${c.vol ? fmt(c.vol) + " kg · " : ""}${fmt(c.liftK)} kcal</span></div>
    <div class="card-b tight">
      <div class="slot-h">種目<span class="ln"></span>
        <button class="btn sm add" data-act="addLift">${IC.plus}追加</button></div>
      ${d.lifts.length ? d.lifts.map((l, i) => {
    const r = liftCalc(l, c.w);
    return `<div class="li">
          <div class="body"><div class="t1">${esc(l.n)}</div>
            <div class="t2">${(l.sets || []).map(s => `${r1(s.kg)}×${r0(s.rep)}`).join("  ")} · ${(l.sets || []).length}セット${l.ph ? " · 片手入力" : ""}${r.orm ? ` · 推定1RM ${r1(r.orm)}kg` : ""}</div></div>
          <div class="r"><div class="a">${fmt(r.vol)}</div><div class="b">kg</div></div>
          <button class="x" data-act="editLift" data-i="${i}" aria-label="${esc(l.n)}を編集">${IC.pen}</button>
          <button class="x" data-act="delLift" data-i="${i}" aria-label="${esc(l.n)}を削除">${IC.x}</button>
        </div>`;
  }).join("") : '<div class="empty">種目名の一部を入れると候補が出ます(例: インクライン)</div>'}
    </div>
  </div>`;
}

/* --------------------------------------------------------------- 運動 */
function actCard(d, c) {
  return `<div class="card">
    <div class="card-h"><span class="card-t">運動・スポーツ</span><span class="sp"></span>
      <span class="sub mono">${fmt(c.actK)} kcal</span></div>
    <div class="card-b tight">
      <div class="slot-h">内容<span class="ln"></span>
        <button class="btn sm add" data-act="addAct">${IC.plus}追加</button></div>
      ${d.acts.length ? d.acts.map((a, i) => `<div class="li">
          <div class="body"><div class="t1">${esc(a.n)}</div>
            <div class="t2">${r0(a.min)}分 · ${r1(a.met)} METs${a.amb ? " · 歩数補正あり" : ""}</div></div>
          <div class="r"><div class="a">${fmt(kcalMet(num(a.met), c.w, num(a.min)))}</div><div class="b">kcal</div></div>
          <button class="x" data-act="delAct" data-i="${i}" aria-label="${esc(a.n)}を削除">${IC.x}</button>
        </div>`).join("") : '<div class="empty">サッカー、バドミントンなど。内容と時間だけでOK</div>'}
    </div>
  </div>`;
}

</script>

<script>
"use strict";
/* ======================================================== カレンダービュー */
function vCal() {
  const ms = CALM, first = parse(ms), y = first.getFullYear(), mo = first.getMonth();
  const lead = (first.getDay() + 6) % 7;               /* 月曜始まり */
  const ndays = new Date(y, mo + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push(null);
  for (let i = 1; i <= ndays; i++) cells.push(`${y}-${P2(mo + 1)}-${P2(i)}`);
  while (cells.length % 7) cells.push(null);

  let sk = 0, sb = 0, n = 0, wFirst = null, wLast = null, trainN = 0, stepSum = 0;
  for (const k of cells) {
    if (!k || k > TODAY) continue;
    const c = calc(k);
    if (c.logged) { n++; sk += c.kcal; sb += c.burn; stepSum += c.rawSteps; if (c.isTrain) trainN++; }
    const d = S.days[k];
    if (d && d.w) { if (wFirst == null) wFirst = d.w; wLast = d.w; }
  }

  return `
  <div class="calhead">
    <button class="navbtn" data-act="pm" aria-label="前の月へ">${IC.L}</button>
    <div class="t">${y}年 ${mo + 1}月</div>
    <button class="navbtn" data-act="nm" aria-label="次の月へ">${IC.R}</button>
  </div>

  <div class="card"><div class="card-b">
    <div class="mstat">
      <div class="b"><div class="k">記録日数</div><div class="v">${n}<small> / ${ndays}日</small></div></div>
      <div class="b"><div class="k">平均収支</div><div class="v" style="color:${n && sk - sb > 0 ? "var(--crit)" : "var(--s2)"}">${n ? signed((sk - sb) / n) : "—"}<small> kcal</small></div></div>
      <div class="b"><div class="k">体重変化</div><div class="v">${wFirst != null && wLast != null ? (wLast - wFirst >= 0 ? "+" : "−") + r1(Math.abs(wLast - wFirst)) : "—"}<small> kg</small></div></div>
      <div class="b"><div class="k">トレ回数</div><div class="v">${trainN}<small> 回</small></div></div>
    </div>
  </div></div>

  <div class="card"><div class="card-b">
    <div class="caldow">${["月", "火", "水", "木", "金", "土", "日"].map(d => `<div>${d}</div>`).join("")}</div>
    <div class="calgrid">${cells.map(k => {
    if (!k) return '<div class="calcell void"></div>';
    const c = calc(k), t = dayTarget(k), dw = dowOf(k);
    const future = k > TODAY;
    const mx = Math.max(c.kcal, c.burn, 1);
    const h = v => Math.max(1, (v / mx) * 14);
    return `<button class="calcell${dw === 0 ? " sun" : dw === 6 ? " sat" : ""}${future ? " future" : ""}" ${k === TODAY ? 'aria-current="date"' : ""} data-go="${k}" aria-label="${parse(k).getMonth() + 1}月${parse(k).getDate()}日">
        <span class="n">${parse(k).getDate()}</span>
        ${c.logged && c.isTrain ? '<span class="dot" style="background:var(--s1)"></span>' : ""}
        ${c.logged ? `<span class="bars" aria-hidden="true">
            <i style="height:${h(c.kcal)}px;background:var(--s1)"></i>
            <i style="height:${h(c.burn)}px;background:var(--s2)"></i>
          </span><span class="kc">${signed(c.net)}</span>` : '<span class="kc" style="margin-top:auto">—</span>'}
      </button>`;
  }).join("")}</div>
    <div class="legend" style="margin-top:10px">
      <span class="it">${SW("var(--s1)")}摂取</span>
      <span class="it">${SW("var(--s2)")}消費</span>
      <span class="it"><span class="swatch" style="background:var(--s1);border-radius:50%"></span>トレ日</span>
    </div>
  </div></div>`;
}

/* ============================================================== グラフ描画 */
const CHARTS = {};
/* cfg: {id,type:'group'|'div'|'line'|'stack',labels,short,series,h,unit,target,mavg} */
function chartSvg(cfg) {
  const n = cfg.labels.length;
  const PL = 40, PR = 12, PT = 14, PB = 24;
  const step = Math.max(20, Math.min(64, 520 / Math.max(1, n)));
  const pw = step * n, W = PL + pw + PR, H = (cfg.h || 150) + PT + PB;
  const ph = cfg.h || 150;

  let lo = 0, hi = 0;
  const vals = [];
  for (const s of cfg.series) for (const v of s.data) if (v != null) vals.push(v);
  if (cfg.type === "stack") {
    for (let i = 0; i < n; i++) { let t = 0; for (const s of cfg.series) t += s.data[i] || 0; vals.push(t); }
  }
  if (cfg.target) vals.push(cfg.target.v);
  if (!vals.length) vals.push(0, 1);
  hi = Math.max(...vals); lo = Math.min(...vals);
  if (cfg.type === "line") { const pad = (hi - lo) * 0.14 || 1; hi += pad; lo -= pad; }
  else if (cfg.type === "div") { const m = Math.max(Math.abs(hi), Math.abs(lo)) * 1.12 || 1; hi = m; lo = -m; }
  else { hi = hi * 1.12 || 1; lo = 0; }
  if (hi === lo) hi = lo + 1;

  const Y = v => PT + ph - ((v - lo) / (hi - lo)) * ph;
  const X = i => PL + step * i + step / 2;

  /* y ticks */
  const ticks = [];
  const TN = 4;
  for (let i = 0; i <= TN; i++) {
    const v = lo + ((hi - lo) * i) / TN;
    ticks.push(`<line class="gridline" x1="${PL}" y1="${Y(v).toFixed(1)}" x2="${PL + pw}" y2="${Y(v).toFixed(1)}"/>
      <text class="tick" x="${PL - 6}" y="${(Y(v) + 3.4).toFixed(1)}" text-anchor="end">${cfg.type === "line" ? r1(v) : fmt(v)}</text>`);
  }

  let marks = "";
  if (cfg.type === "group") {
    const bw = Math.min(11, (step - 6) / cfg.series.length);
    cfg.series.forEach((s, si) => {
      s.data.forEach((v, i) => {
        if (v == null) return;
        const x = X(i) - (cfg.series.length * bw + 2) / 2 + si * (bw + 2);
        const y = Y(v), h0 = Y(lo) - y;
        marks += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0.6, h0).toFixed(1)}" rx="4" fill="${s.color}"/>`;
      });
    });
  } else if (cfg.type === "div") {
    const bw = Math.min(14, step - 8);
    const s = cfg.series[0];
    s.data.forEach((v, i) => {
      if (v == null) return;
      const z = Y(0), y = Y(v);
      const col = v > 0 ? "var(--s1)" : "var(--s2)";
      marks += `<rect x="${(X(i) - bw / 2).toFixed(1)}" y="${Math.min(y, z).toFixed(1)}" width="${bw}" height="${Math.max(0.6, Math.abs(z - y)).toFixed(1)}" rx="4" fill="${col}"/>`;
    });
    marks += `<line class="axisline" x1="${PL}" y1="${Y(0).toFixed(1)}" x2="${PL + pw}" y2="${Y(0).toFixed(1)}"/>`;
  } else if (cfg.type === "stack") {
    const bw = Math.min(16, step - 8);
    const acc = new Array(n).fill(0);
    cfg.series.forEach(s => {
      s.data.forEach((v, i) => {
        if (!v) return;
        const y0 = Y(acc[i]), y1 = Y(acc[i] + v);
        acc[i] += v;
        marks += `<rect x="${(X(i) - bw / 2).toFixed(1)}" y="${y1.toFixed(1)}" width="${bw}" height="${Math.max(0.6, y0 - y1 - 2).toFixed(1)}" rx="2" fill="${s.color}"/>`;
      });
    });
  } else { /* line */
    cfg.series.forEach(s => {
      const pts = s.data.map((v, i) => (v == null ? null : [X(i), Y(v)])).filter(Boolean);
      if (pts.length > 1) marks += `<path class="ser" d="${pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ")}" stroke="${s.color}" ${s.dash ? 'stroke-dasharray="5 4" opacity="0.9"' : ""}/>`;
      if (!s.dash) pts.forEach(p => { marks += `<circle class="dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.6" fill="${s.color}"/>`; });
      if (pts.length) {
        const L = pts[pts.length - 1];
        if (!s.dash) marks += `<circle cx="${L[0].toFixed(1)}" cy="${L[1].toFixed(1)}" r="5" fill="${s.color}" stroke="var(--surf)" stroke-width="2"/>`;
      }
    });
  }

  let tgt = "";
  if (cfg.target != null && cfg.target.v != null) {
    tgt = `<line class="tgt" x1="${PL}" y1="${Y(cfg.target.v).toFixed(1)}" x2="${PL + pw}" y2="${Y(cfg.target.v).toFixed(1)}"/>
      <text class="lbl" x="${PL + pw}" y="${(Y(cfg.target.v) - 5).toFixed(1)}" text-anchor="end">${esc(cfg.target.label)}</text>`;
  }

  const xl = cfg.labels.map((l, i) =>
    n > 16 && i % Math.ceil(n / 12) !== 0 ? "" :
      `<text class="tick" x="${X(i).toFixed(1)}" y="${H - 7}" text-anchor="middle">${esc(cfg.short ? cfg.short[i] : l)}</text>`).join("");

  const hits = cfg.labels.map((l, i) =>
    `<rect class="hit" data-i="${i}" tabindex="0" role="button" aria-label="${esc(l)}" x="${(PL + step * i).toFixed(1)}" y="${PT}" width="${step.toFixed(1)}" height="${ph}"/>`).join("");

  return `<div class="chart-wrap" style="position:relative" data-chart="${cfg.id}">
    <svg class="chart" viewBox="0 0 ${W.toFixed(0)} ${H.toFixed(0)}" role="img" aria-label="${esc(cfg.aria || "")}">
      ${ticks.join("")}
      <line class="axisline" x1="${PL}" y1="${PT + ph}" x2="${PL + pw}" y2="${PT + ph}"/>
      ${marks}${tgt}
      <line class="cross" x1="0" y1="${PT}" x2="0" y2="${PT + ph}" style="display:none"/>
      ${hits}
    </svg>
  </div>`;
}
function chartCard(cfg, legend) {
  CHARTS[cfg.id] = cfg;
  const show = CH.tables[cfg.id];
  return `<div class="card">
    <div class="card-h"><span class="card-t">${esc(cfg.title)}</span><span class="sp"></span>
      <button class="btn sm gh" data-act="tbl" data-id="${cfg.id}">${show ? "グラフ" : "表で見る"}</button></div>
    <div class="card-b">
      ${legend ? `<div class="legend">${cfg.series.filter(s => !s.hide).map(s => `<span class="it">${SW(s.color)}${esc(s.label)}</span>`).join("")}${cfg.target ? `<span class="it"><span class="swatch" style="background:linear-gradient(90deg,var(--ink) 45%,transparent 45%);opacity:.5"></span>${esc(cfg.target.label)}</span>` : ""}</div>`
      : cfg.legend ? `<div class="legend">${cfg.legend}</div>` : ""}
      ${show ? chartTable(cfg) : chartSvg(cfg)}
    </div>
  </div>`;
}
function chartTable(cfg) {
  return `<div class="tblwrap"><table class="dt"><thead><tr><th>日付</th>
    ${cfg.series.map(s => `<th>${esc(s.label)}</th>`).join("")}</tr></thead><tbody>
    ${cfg.labels.map((l, i) => `<tr><td>${esc(l)}</td>${cfg.series.map(s => `<td>${s.data[i] == null ? "—" : (cfg.type === "line" ? r1(s.data[i]) : fmt(s.data[i]))}</td>`).join("")}</tr>`).join("")}
    </tbody></table></div>`;
}
function bindCharts() {
  document.querySelectorAll("[data-chart]").forEach(wrap => {
    const cfg = CHARTS[wrap.dataset.chart];
    if (!cfg) return;
    const svg = wrap.querySelector("svg"), cross = svg.querySelector(".cross");
    let tip = null;
    const show = i => {
      const hit = svg.querySelector(`.hit[data-i="${i}"]`);
      if (!hit) return;
      const hb = hit.getBoundingClientRect(), wb = wrap.getBoundingClientRect();
      if (!tip) { tip = document.createElement("div"); tip.className = "tip"; wrap.appendChild(tip); }
      tip.innerHTML = `<div class="d">${esc(cfg.labels[i])}</div>` +
        cfg.series.filter(s => !s.hide).map(s => `<div class="r"><span class="n">${SW(s.color)}${esc(s.label)}</span><span class="v">${s.data[i] == null ? "—" : (cfg.type === "line" ? r1(s.data[i]) : fmt(s.data[i])) + (cfg.unit || "")}</span></div>`).join("");
      const cx = hb.left - wb.left + hb.width / 2;
      tip.style.left = Math.max(2, Math.min(wrap.clientWidth - tip.offsetWidth - 2, cx - tip.offsetWidth / 2)) + "px";
      tip.style.top = "2px";
      cross.setAttribute("x1", hit.getAttribute("x") * 1 + hit.getAttribute("width") / 2);
      cross.setAttribute("x2", hit.getAttribute("x") * 1 + hit.getAttribute("width") / 2);
      cross.style.display = "";
    };
    const hide = () => { if (tip) tip.remove(); tip = null; cross.style.display = "none"; };
    svg.querySelectorAll(".hit").forEach(h => {
      h.addEventListener("pointerenter", () => show(h.dataset.i));
      h.addEventListener("focus", () => show(h.dataset.i));
      h.addEventListener("blur", hide);
    });
    wrap.addEventListener("pointerleave", hide);
  });
}

/* ============================================================ グラフビュー */
function vChart() {
  const span = CH.span;
  let keys = [], title = "";
  if (span === "week") {
    const ws = weekStart(CH.anchor);
    for (let i = 0; i < 7; i++) keys.push(addD(ws, i));
    const a = parse(keys[0]), b = parse(keys[6]);
    title = `${a.getMonth() + 1}/${a.getDate()} – ${b.getMonth() + 1}/${b.getDate()}`;
  } else {
    const ms = monthStart(CH.anchor), f = parse(ms);
    const nd = new Date(f.getFullYear(), f.getMonth() + 1, 0).getDate();
    for (let i = 1; i <= nd; i++) keys.push(`${f.getFullYear()}-${P2(f.getMonth() + 1)}-${P2(i)}`);
    title = `${f.getFullYear()}年 ${f.getMonth() + 1}月`;
  }
  const lab = keys.map(k => { const d = parse(k); return `${d.getMonth() + 1}/${d.getDate()}(${DOW[d.getDay()]})`; });
  const shrt = keys.map(k => { const d = parse(k); return span === "week" ? DOW[d.getDay()] : String(d.getDate()); });
  const C = keys.map(k => calc(k));
  const hasK = (k, i) => keys[i] <= TODAY && C[i].logged;
  const gv = (f) => C.map((c, i) => (hasK(keys[i], i) ? f(c) : null));

  const wRaw = keys.map(k => (S.days[k] && S.days[k].w) || null);
  /* 7日移動平均(欠測はスキップ) */
  const wAvg = keys.map((k, i) => {
    let s = 0, n = 0;
    for (let j = 0; j < 7; j++) { const kk = addD(k, -j); const d = S.days[kk]; if (d && d.w) { s += d.w; n++; } }
    return n >= 3 ? s / n : null;
  });
  const bf = keys.map(k => (S.days[k] && S.days[k].bf) || null);
  const tgt = dayTarget(keys[keys.length - 1]);

  const sum = { k: 0, b: 0, n: 0 };
  C.forEach((c, i) => { if (hasK(keys[i], i)) { sum.k += c.kcal; sum.b += c.burn; sum.n++; } });

  return `
  <div class="row" style="margin-bottom:12px;gap:8px">
    <div class="seg" role="group" aria-label="期間">
      <button data-act="span" data-v="week" aria-pressed="${span === "week"}">週</button>
      <button data-act="span" data-v="month" aria-pressed="${span === "month"}">月</button>
    </div>
    <span class="sp" style="flex:1"></span>
    <button class="navbtn" data-act="pp" aria-label="前へ">${IC.L}</button>
    <button class="navbtn" data-act="np" aria-label="次へ">${IC.R}</button>
  </div>
  ${span === "week" ? weekCard(weekBudget(CH.anchor)) : ""}
  <div class="card"><div class="card-b">
    <div class="mstat">
      <div class="b"><div class="k">期間</div><div class="v" style="font-size:15px">${title}</div></div>
      <div class="b"><div class="k">平均摂取</div><div class="v">${sum.n ? fmt(sum.k / sum.n) : "—"}<small> kcal</small></div></div>
      <div class="b"><div class="k">平均消費</div><div class="v">${sum.n ? fmt(sum.b / sum.n) : "—"}<small> kcal</small></div></div>
      <div class="b"><div class="k">累積収支</div><div class="v" style="color:${sum.k - sum.b > 0 ? "var(--crit)" : "var(--s2)"}">${sum.n ? signed(sum.k - sum.b) : "—"}<small> kcal</small></div></div>
    </div>
  </div></div>

  ${chartCard({
    id: "kcal", title: "カロリー(摂取・消費)", type: "group", unit: " kcal",
    aria: "日別の摂取カロリーと消費カロリー", labels: lab, short: shrt, h: 150,
    target: { v: tgt.kcal, label: "摂取目標" },
    series: [
      { label: "摂取", color: "var(--s1)", data: gv(c => r0(c.kcal)) },
      { label: "消費", color: "var(--s2)", data: gv(c => r0(c.burn)) }
    ]
  }, true)}

  ${chartCard({
    id: "net", title: "収支 (摂取 − 消費)", type: "div", unit: " kcal",
    aria: "日別のカロリー収支", labels: lab, short: shrt, h: 130,
    legend: `<span class="it">${SW("var(--s1)")}上へ = オーバー(摂取が勝った日)</span><span class="it">${SW("var(--s2)")}下へ = アンダー(消費が勝った日・減量方向)</span>`,
    series: [{ label: "収支", color: "var(--s1)", data: gv(c => r0(c.net)) }]
  }, false)}

  ${chartCard({
    id: "pfc", title: "PFC(摂取内訳)", type: "stack", unit: " g",
    aria: "日別のタンパク質・脂質・炭水化物", labels: lab, short: shrt, h: 140,
    series: [
      { label: "タンパク質", color: "var(--s2)", data: gv(c => r0(c.p)) },
      { label: "脂質", color: "var(--s3)", data: gv(c => r0(c.f)) },
      { label: "炭水化物", color: "var(--s1)", data: gv(c => r0(c.cb)) }
    ]
  }, true)}

  ${chartCard({
    id: "w", title: "体重", type: "line", unit: " kg",
    aria: "体重の推移", labels: lab, short: shrt, h: 150,
    target: S.goal.on ? { v: S.goal.targetW, label: "目標 " + r1(S.goal.targetW) + "kg" } : null,
    series: [
      { label: "体重", color: "var(--s1)", data: wRaw },
      { label: "7日平均", color: "var(--s2)", data: wAvg, dash: 1 }
    ]
  }, true)}

  ${chartCard({
    id: "bf", title: "体脂肪率", type: "line", unit: " %",
    aria: "体脂肪率の推移", labels: lab, short: shrt, h: 130,
    series: [{ label: "体脂肪率", color: "var(--s3)", data: bf }]
  }, false)}

  ${chartCard({
    id: "step", title: "歩数(補正後の純歩数)", type: "group", unit: " 歩",
    aria: "日別の歩数", labels: lab, short: shrt, h: 120,
    series: [{ label: "純歩数", color: "var(--s2)", data: gv(c => c.eff) }]
  }, false)}`;
}

/* ============================================================== 目標ビュー */
function vGoal() {
  const g = S.goal, pl = plan(TODAY), w = weightAt(TODAY);
  const left = diffD(TODAY, g.date);
  const total = Math.max(1, diffD(g.startDate, g.date));
  const done = cl(diffD(g.startDate, TODAY), 0, total);
  const lostKg = (g.startW || w) - w;
  const needKg = w - g.targetW;
  const paceKgWk = (pl.deficit * 7) / 7200;
  /* 7日平均から見た予測 */
  const trend = trendPerWeek();
  const projected = trend != null ? w + (trend * left) / 7 : null;

  return `
  <div class="card goalhero">
    <div class="card-h"><span class="card-t">ゴール</span><span class="sp"></span>
      <span class="chip ${left <= 7 ? "warn" : "s2"}">${left > 0 ? `あと ${left} 日` : left === 0 ? "本番当日" : "終了"}</span></div>
    <div class="card-b">
      <div class="bal-top" style="margin-bottom:12px">
        <div class="bal-hero">
          <span class="lbl">${esc(g.label || "目標")} · ${g.date.slice(5).replace("-", "/")}</span>
          <span class="val"><span class="hero-num">${r1(w)}</span><span class="unit">kg → ${r1(g.targetW)} kg</span></span>
        </div>
        <div class="bal-side">
          <div class="kv"><span class="k">これまで</span><span class="v">${lostKg >= 0 ? "−" : "+"}${r1(Math.abs(lostKg))}<small>kg</small></span></div>
          <div class="kv"><span class="k">残り</span><span class="v">${needKg > 0 ? r1(needKg) : 0}<small>kg</small></span></div>
        </div>
      </div>
      <div class="pacebar" role="img" aria-label="期間の進捗 ${r0((done / total) * 100)}%">
        <span class="fill" style="width:${(done / total) * 100}%"></span>
        <span class="txt" style="color:${done / total > 0.5 ? "#fff" : "var(--ink)"}">${done} / ${total} 日</span>
      </div>
      ${projected != null ? `<div class="note ${projected <= g.targetW + 0.4 ? "" : "w"}" style="margin-top:10px">
        直近の7日平均の傾き(<b>${trend >= 0 ? "+" : "−"}${r1(Math.abs(trend))} kg/週</b>)がこのまま続くと、本番時点で <b>${r1(projected)} kg</b> の見込み。
        ${projected <= g.targetW + 0.4 ? "ペースは足りています。" : `目標には <b>${r1(projected - g.targetW)} kg</b> 足りません。摂取をあと ${fmt(((projected - g.targetW) * 7200) / Math.max(1, left))} kcal/日 削るか、消費を同じだけ足す必要があります。`}
      </div>` : '<div class="note" style="margin-top:10px">体重を3日以上記録すると、7日平均の傾きから本番時点の予測が出ます。</div>'}
    </div>
  </div>

  <div class="card">
    <div class="card-h"><span class="card-t">1日の設計 — 目標体重と期日から自動計算</span><span class="sp"></span>
      ${pl.capped ? '<span class="chip warn">' + IC.warn + "安全上限</span>" : ""}</div>
    <div class="card-b">
      <div class="mstat" style="margin-bottom:12px">
        <div class="b" style="background:var(--s1-soft)"><div class="k">目標摂取</div><div class="v">${fmt(pl.kcal)}<small> kcal</small></div></div>
        <div class="b" style="background:var(--s2-soft)"><div class="k">目標消費(平均)</div><div class="v">${fmt(pl.burn)}<small> kcal</small></div></div>
        <div class="b"><div class="k">1日の赤字</div><div class="v">${fmt(pl.deficit)}<small> kcal</small></div></div>
        <div class="b"><div class="k">想定ペース</div><div class="v">${r1(paceKgWk)}<small> kg/週</small></div></div>
      </div>

      <div class="slot-h">赤字 ${fmt(pl.deficit)} kcal の作り方<span class="ln"></span></div>
      <div class="track" style="height:16px;margin:6px 0 8px">
        <i style="width:${pl.deficit ? (pl.fromFood / pl.deficit) * 100 : 100}%;background:var(--s1)"></i>
        <i style="left:${pl.deficit ? (pl.fromFood / pl.deficit) * 100 : 100}%;width:${pl.deficit ? (pl.fromMove / pl.deficit) * 100 : 0}%;background:var(--s2)"></i>
      </div>
      <div class="legend" style="margin-bottom:10px">
        <span class="it">${SW("var(--s1)")}食事を減らす ${fmt(pl.fromFood)} kcal</span>

      <div class="pills" style="margin-bottom:11px">

      `<button class="pill" data-act="share" data-v="${v}" aria-pressed="${Math.abs(pl.share - v) < 0.001}">${n}<span style="opacity:.65"> ${r0(v * 100)}%</span></button>`).join("")}

        <div class="planrow"><span class="dd">P</span><span class="nm">タンパク質<i>体重×${r1(g.pKg)} g・毎日同じ</i></span><span class="v">${r0(pl.p)} g</span></div>
        <div class="planrow"><span class="dd">F</span><span class="nm">脂質<i>体重×${r1(g.fKg)} g・毎日同じ</i></span><span class="v">${r0(pl.f)} g</span></div>
      </div>
      <div class="slot-h">トレ日 (週${pl.td}日) とオフ日 (週${7 - pl.td}日)<span class="ln"></span>
        <span class="chip ${pl.mb ? "good" : ""}">差 ${fmt(pl.bonus)} kcal · ${esc(pl.bonusSrc)}</span></div>
      <div class="tblwrap" style="max-height:none">
        <table class="dt"><thead><tr><th></th><th>トレ日</th><th>オフ日</th><th>差</th></tr></thead><tbody>

          <tr><td>目標摂取</td><td>${fmt(pl.kcalTrain)}</td><td>${fmt(pl.kcalRest)}</td><td>${fmt(pl.kcalTrain - pl.kcalRest)}</td></tr>
          <tr><td>炭水化物</td><td>${r0(pl.cTrain)} g</td><td>${r0(pl.cRest)} g</td><td>${r0(pl.cTrain - pl.cRest)} g</td></tr>
          <tr><td>±</td><td>−${fmt(pl.deficit)}</td><td>−${fmt(pl.deficit)}</td><td>0</td></tr>
        </tbody></table>
      </div>

function trendPerWeek() {
  const ks = Object.keys(S.days).filter(k => S.days[k].w && k <= TODAY).sort();
  if (ks.length < 3) return null;
  const use = ks.slice(-21);
  const t0 = parse(use[0]);
  let n = 0, sx = 0, sy = 0, sxy = 0, sxx = 0;
  for (const k of use) {
    const x = (parse(k) - t0) / 86400000, y = S.days[k].w;
    n++; sx += x; sy += y; sxy += x * y; sxx += x * x;
  }
  const den = n * sxx - sx * sx;
  if (!den) return null;
  return ((n * sxy - sx * sy) / den) * 7;
}

/* ------------------------------------------------------- 食事メニュー生成 */
function findFood(n) { return allFoods().find(f => f.n === n); }
function mk(name, g, slot) {
  const f = findFood(name);
  if (!f || g <= 0) return null;
  const r = g / 100;
  return { n: f.n, g: r0(g), q: r0(g) + "g", slot, kcal: f.kcal * r, p: f.p * r, f: f.f * r, cb: f.cb * r, s: f.s * r };
}
/* 目標のP/Fを先に固定し、残りカロリーを白米で調整する組み方。
   副菜 → タンパク質の柱 → 不足分を鶏むねで逆算 → 脂質の穴埋め → 残りを炭水化物、の順。
   この順番でないと副菜のP/Fが積み増しになって目標を超えてしまう。 */
function buildMenu(isTrain) {
  const pl = plan(TODAY);
  const cT = isTrain ? pl.cTrain : pl.cRest;

  /* 白米・オートミール・ナッツにもタンパク質が乗るので、1回目で拾った
     「主役以外のタンパク質」を差し引いて2回目を組む(2パスでほぼ収束する) */
  function assemble(pAdj) {
    const items = [];
    const push = x => { if (x) items.push(x); };
    const sum = k => items.reduce((a, x) => a + x[k], 0);

    /* 1. 先に決まっている副菜 */
    push(mk("ブロッコリー(ゆで)", 150, "l"));
    push(mk("木綿豆腐", 150, "d"));
    push(mk("わかめ(生)", 30, "d"));

    /* 2. タンパク質の柱 */
    push(mk("ホエイプロテイン(粉)", 30, "b"));
    push(mk("ホエイプロテイン(粉)", 30, "s"));
    push(mk("鶏卵(全卵・生)", 100, "b"));
    push(mk(isTrain ? "白鮭(生)" : "サバ水煮缶", 100, "d"));

    /* 3. 足りないタンパク質を鶏むねで逆算 */
    const chick = cl((pl.p - sum("p") - pAdj) / 0.233, 0, 500);
    if (chick >= 10) push(mk("鶏むね肉(皮なし・生)", Math.round(chick / 10) * 10, "l"));

    /* 4. 脂質は不足分だけ足す(超過していたら足さない) */
    const fRem = pl.f - sum("f");
    if (fRem > 4) push(mk("アーモンド(素焼き)", Math.min(30, Math.round(fRem / 0.541)), "s"));
    if (pl.f - sum("f") > 3) push(mk("オリーブオイル", Math.round(pl.f - sum("f")), "l"));
    const pBeforeCarb = sum("p");

    /* 5. 残りを炭水化物に回す */
    let cRem = cT - sum("cb");
    if (isTrain && cRem > 60) { push(mk("バナナ", 90, "s")); cRem = cT - sum("cb"); }
    if (cRem > 140) { push(mk("オートミール", 40, "b")); cRem = cT - sum("cb"); }
    const riceG = Math.max(0, cRem / 0.371);
    const rl = Math.round((riceG * 0.55) / 10) * 10, rd = Math.max(0, Math.round((riceG - rl) / 10) * 10);
    push(mk("白米(炊飯)", rl, "l"));
    push(mk("白米(炊飯)", rd, "d"));
    return { items, carry: sum("p") - pBeforeCarb };
  }
  const first = assemble(0);
  return assemble(first.carry).items;
}
function menuCard() {
  const tr = buildMenu(true), of = buildMenu(false);
  const tot = a => a.reduce((o, x) => ({ kcal: o.kcal + x.kcal, p: o.p + x.p, f: o.f + x.f, cb: o.cb + x.cb }), { kcal: 0, p: 0, f: 0, cb: 0 });
  const blk = (name, arr, isT) => {
    const t = tot(arr);
    return `<div class="slot-h">${name}<span class="ln"></span><span class="kc">${fmt(t.kcal)} kcal · P${r0(t.p)} F${r0(t.f)} C${r0(t.cb)}</span>
      <button class="btn sm gh" data-act="applyMenu" data-t="${isT ? 1 : 0}">この日に入れる</button></div>
      ${SLOTS.map(([sk, sn]) => {
      const g = arr.filter(x => x.slot === sk);
      if (!g.length) return "";
      return `<div class="planrow"><span class="dd">${sn}</span>
        <span class="nm menu-day">${g.map(x => `${esc(x.n)} <span style="color:var(--muted)">${x.g}g</span>`).join("<br>")}</span>
        <span class="v">${fmt(g.reduce((a, x) => a + x.kcal, 0))}</span></div>`;
    }).join("")}`;
  };
  return `<div class="card">
    <div class="card-h"><span class="card-t">目標から組んだ1日のメニュー</span></div>
    <div class="card-b tight">
      ${blk("トレ日", tr, true)}
      ${blk("オフ日", of, false)}
      <div class="note" style="margin-top:11px">P/Fを先に固定して、残りカロリーを白米で調整する組み方です。魚はトレ日=白鮭(低脂質)、オフ日=サバ缶(DHA/EPA)にしてHDLの底上げも兼ねています。</div>
    </div>
  </div>`;
}

/* ------------------------------------------------------------ 仕上げ1週間 */
function peakCard(left) {
  const pl = plan(TODAY), w = pl.w;
  const rows = [];
  for (let i = left; i >= 0; i--) {
    const k = addD(TODAY, left - i);
    const d = parse(k);
    let nm, kc, cb, note;
    if (i > 2) { nm = "減量継続"; kc = pl.kcal; cb = pl.cRest; note = "ここで粘るほど仕上がる"; }
    else if (i === 2) { nm = "減量終了・維持へ"; kc = pl.tdee; cb = w * 4; note = "脂質は40g程度に抑えてカーボへ枠を回す"; }
    else if (i === 1) { nm = "カーボアップ"; kc = pl.tdee + 200; cb = w * 5; note = "白米・餅・和菓子。低脂質・低繊維で。塩分は普段どおり"; }
    else { nm = "当日"; kc = pl.tdee * 0.4; cb = w * 1.5; note = "食べ慣れたものを軽く。初めてのものは入れない"; }
    rows.push(`<div class="planrow">
      <span class="dd">${i === 0 ? "当日" : "D-" + i}<br>${d.getMonth() + 1}/${d.getDate()}</span>
      <span class="nm">${nm}<i>${note}</i></span>
      <span class="v">${fmt(kc)} kcal<br><span style="color:var(--muted)">C ${r0(cb)}g</span></span>
    </div>`);
  }
  return `<div class="card">
    <div class="card-h"><span class="card-t">仕上げの ${left + 1} 日</span><span class="sp"></span>
      <span class="chip warn">${IC.warn}水抜き・塩抜きはしない</span></div>
    <div class="card-b tight">
      <div class="plan">${rows.join("")}</div>
      <div class="note c" style="margin-top:11px">水抜き・塩抜き・利尿系サプリは<b>組み込んでいません</b>。見た目の効果に対して脱水の負担が大きく、本番で力が出なくなるためです。${PROFILE.medNote ? "<br>" + PROFILE.medNote : ""}<br>前日にカーボを入れると体重は1〜1.5kg戻りますが、見た目はむしろ張って良くなります。<b>当日は体重計に乗らないこと。</b></div>
    </div>
  </div>`;
}

  host.innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(SH.title)}">

  </div></div>`;
  const q = host.querySelector("[data-q]");
  if (q) { q.focus(); q.addEventListener("input", () => { SH.q = q.value; const c = host.querySelector(".cands"); if (c) c.innerHTML = SH.cands(); }); }

  if (fi) fi.focus();
}

/* --------------------------------------------------- カロリー直接入力シート */
function quickVals() {
  const g = k => { const e = document.querySelector(`[data-q1="${k}"]`); return e ? e.value : ""; };
  const p = num(g("p")), f = num(g("f")), cb = num(g("cb"));
  const typed = g("kcal").trim();
  const fromMacro = p * 4 + f * 9 + cb * 4;
  return { n: g("n").trim(), typed, kcal: typed === "" ? fromMacro : num(typed), fromMacro, p, f, cb, s: num(g("s")), slot: g("slot") };
}
function quickPreview() {
  const el = document.querySelector("[data-qprev]");
  if (!el) return;
  const v = quickVals();
  if (v.kcal <= 0) { el.className = "note"; el.innerHTML = "カロリー、または P/F/C のどれかを入れてください。"; return; }
  if (v.typed === "") {
    el.className = "note a";
    el.innerHTML = `P/F/C から計算して <b>${fmt(v.fromMacro)} kcal</b> として登録します。`;
    return;
  }
  const diff = v.fromMacro > 0 ? Math.abs(v.fromMacro - v.kcal) / v.kcal : 0;
  if (v.fromMacro > 0 && diff > 0.2) {
    el.className = "note w";
    el.innerHTML = `${IC.warn} P/F/C から計算すると <b>${fmt(v.fromMacro)} kcal</b> で、入力した <b>${fmt(v.kcal)} kcal</b> と離れています。どちらか打ち間違いかもしれません（このまま登録するなら入力値を使います）。`;
    return;
  }
  el.className = "note";
  el.innerHTML = `<b>${fmt(v.kcal)} kcal</b>${v.fromMacro > 0 ? ` · P${r1(v.p)} F${r1(v.f)} C${r1(v.cb)}` : " · P/F/C は 0 として記録します"}`;
}

/* ---------------------------------------------------------------- 種目シート */
function lastLift(name) {
  const ks = Object.keys(S.days).filter(k => k < CUR).sort().reverse();
  for (const k of ks) { const l = (S.days[k].lifts || []).find(x => x.n === name); if (l && l.sets && l.sets.length) return l; }
  return null;
}
function lastSets(name) {
  const l = lastLift(name);
  return l ? l.sets.map(s => ({ kg: s.kg, rep: s.rep })) : [{ kg: "", rep: "" }, { kg: "", rep: "" }, { kg: "", rep: "" }];
}
/* 片手入力の初期値: ダンベル・ケトルベルは既定で片手、前回の記録があればそれを優先 */
function defaultPH(name) {
  const prev = lastLift(name);
  if (prev && prev.ph != null) return prev.ph ? 1 : 0;
  const ex = LIFTS.find(x => x.n === name);
  if (!ex) return 0;
  if (ex.e !== "ダンベル" && ex.e !== "ケトルベル") return 0;
  /* 片方だけ持つ / 両手で1個持つ種目は対象外 */
  return /ワンハンド|コンセントレーション|ゴブレット|プルオーバー|サイドベンド|ターキッシュ|スーツケース|片手/.test(name) ? 0 : 1;
}
function sheetLift(editIdx) {
  const ex = editIdx != null ? day(CUR).lifts[editIdx] : null;
  openSheet({
    title: ex ? "トレーニングを編集" : "トレーニングを追加", q: "", editIdx,
    sel: ex ? Object.assign({ n: ex.n, met: ex.met, m: "", e: "" }, LIFTS.find(x => x.n === ex.n) || {}) : null,
    sets: ex ? ex.sets.map(s => ({ kg: s.kg, rep: s.rep })) : [],
    ph: ex ? (ex.ph ? 1 : 0) : 0,
    cands() {
      const favs = S.fav.l.map(n => LIFTS.find(f => f.n === n)).filter(Boolean);
      const list = this.q ? search(LIFTS, this.q, liftKey, 80) : favs.concat(LIFTS.slice(0, 40));
      if (!list.length) return '<div class="empty">見つかりません。別の言い方で試してください</div>';
      return list.map(f => `<button class="cand" data-act="pickLift" data-n="${esc(f.n)}">
        <div class="body"><div class="t1">${esc(f.n)}</div><div class="t2">${esc(f.m)} · ${esc(f.e)}</div></div>
        <span class="tag">${r1(f.met)} METs</span></button>`).join("");
    },
    body() {
      if (!this.sel) {
        return `<div class="srch">${IC.srch}<input class="inp" data-q placeholder="種目名の一部(例: インクライン、スクワット、ロウ)" value="${esc(this.q)}"></div>
          <div class="cands">${this.cands()}</div>`;
      }
      if (!this.sets.length) { this.sets = lastSets(this.sel.n); this.ph = defaultPH(this.sel.n); }
      const w = weightAt(CUR);
      const dumb = this.sel.e === "ダンベル" || this.sel.e === "ケトルベル";
      const reps = this.sets.reduce((a, s) => a + num(s.rep), 0);
      const estRest = S.set.restSec * restFactor(this.sel.met);
      const estMin = (reps * S.set.repSec + this.sets.length * estRest) / 60;
      const vol = this.sets.reduce((a, s) => a + num(s.kg) * num(s.rep), 0) * (this.ph ? 2 : 1);
      return `<div class="row" style="margin-bottom:10px">
          ${this.editIdx == null ? `<button class="btn sm gh" data-act="backLift">${IC.L}戻る</button>` : ""}
          <span class="sp" style="flex:1"></span>
          <button class="btn sm gh" data-act="favLift">${IC.star}${S.fav.l.includes(this.sel.n) ? "よく使うから外す" : "よく使うに追加"}</button>
        </div>
        <div style="font-size:16px;font-weight:600;margin-bottom:${dumb ? "9" : "11"}px">${esc(this.sel.n)}</div>
        ${dumb ? `<div class="fld" style="margin-bottom:11px"><label>入力する重量</label>
          <div class="pills">
            <button class="pill" data-act="ph" data-v="1" aria-pressed="${!!this.ph}">片手の重量</button>
            <button class="pill" data-act="ph" data-v="0" aria-pressed="${!this.ph}">合計の重量</button>
          </div>
          <div class="sub" style="margin-top:5px">${this.ph ? "左右あるので、ボリュームは入力した重量の<b>2倍</b>で集計します" : "入力した重量をそのまま集計します(ゴブレット等、1個を両手で持つ種目)"}</div></div>` : ""}
        <div class="fld" style="margin-bottom:12px"><label>まとめて入力 — 同じ重量で何セットか</label>
          <div class="row" style="gap:6px">
            <input class="inp mono n" type="number" inputmode="decimal" step="0.5" min="0" placeholder="kg" data-bulk="kg" style="flex:1;min-width:0">
            <span style="color:var(--muted);font-weight:700">×</span>
            <input class="inp mono n" type="number" inputmode="numeric" step="1" min="1" placeholder="回" data-bulk="rep" style="flex:1;min-width:0">
            <span style="color:var(--muted);font-weight:700">×</span>
            <input class="inp mono n" type="number" inputmode="numeric" step="1" min="1" max="20" value="3" data-bulk="set" style="flex:1;min-width:0">
            <span style="color:var(--muted);font-size:12px">セット</span>
            <button class="btn sm pri" data-act="bulkAdd" style="flex:none">${IC.plus}</button>
          </div></div>
        <div class="setrow" style="color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.06em">
          <span></span><span>重量 (kg)${dumb && this.ph ? "/片手" : ""}</span><span>回数</span><span></span></div>
        ${this.sets.map((s, i) => `<div class="setrow">
          <span class="idx">${i + 1}</span>
          <input class="inp mono n" type="number" inputmode="decimal" step="0.5" min="0" value="${s.kg}" data-set="${i}" data-fld="kg"${i === 0 ? " data-first" : ""}>
          <input class="inp mono n" type="number" inputmode="numeric" step="1" min="0" value="${s.rep}" data-set="${i}" data-fld="rep">
          <button class="x" data-act="delSet" data-i="${i}" aria-label="${i + 1}セット目を削除">${IC.x}</button>
        </div>`).join("")}
        <button class="btn sm add blk" data-act="addSet" style="margin-top:4px">${IC.plus}セットを足す</button>
        <div class="note" style="margin-top:11px">総ボリューム <b>${fmt(vol)} kg</b> · ${reps} レップ<br>
          所要 <b>${r0(estMin)} 分</b> の見込み → 推定消費 <b>${fmt(kcalMet(this.sel.met, w, estMin))} kcal</b>
          <span style="color:var(--muted)">(1レップ${r1(S.set.repSec)}秒 + 休憩${r0(estRest)}秒で計算)</span></div>`;
    },
    foot() {
      if (!this.sel) return "";
      return `<button class="btn gh" data-act="closeSheet">やめる</button><button class="btn pri" data-act="saveLift">${this.editIdx == null ? "追加する" : "保存する"}</button>`;
    }
  });
}

/* ============================================================== データ入出 */
function mergeIn(inc) {
  if (!inc || typeof inc !== "object" || !inc.days) throw new Error("形式が違います");
  let n = 0;
  for (const k of Object.keys(inc.days)) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) continue;
    const a = S.days[k], b = inc.days[k];
    if (!a || (b.u || 0) >= (a.u || 0)) { S.days[k] = b; n++; }
  }
  if (inc.set) S.set = Object.assign(S.set, inc.set);
  if (inc.goal) S.goal = Object.assign(S.goal, inc.goal);
  if (Array.isArray(inc.my)) for (const f of inc.my) if (!S.my.some(x => x.n === f.n)) S.my.push(f);
  if (Array.isArray(inc.sets)) for (const s of inc.sets) if (!S.sets.some(x => x.n === s.n)) S.sets.push(s);
  normalizeGoal();
  DATA_STAMP++;
  save();
  return n;
}
async function cap(n) { try { return window.claude && window.claude.use ? await window.claude.use(n) : null; } catch (e) { return null; } }
/* ローカルファイルとして開いている場合は Blob で直接ダウンロードする */
function blobSave(fn, data) {
  try {
    const u = URL.createObjectURL(new Blob([data], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = u; a.download = fn; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 4000);
    return true;
  } catch (e) { return false; }
}
async function expFile() {
  const data = JSON.stringify(S);
  const fn = `recomp-${TODAY}.json`;
  const dl = await cap("downloads");
  if (dl) {
    try { await dl.save({ filename: fn, data }); toast("書き出しました"); return; }
    catch (e) { if (e && e.code === "declined") return; }
  } else if (blobSave(fn, data)) { toast(`${fn} を保存しました`); return; }
  toast("ファイルに書き出せないのでクリップボードにコピーします");
  await expClip();
}
async function expClip() {
  const data = JSON.stringify(S);
  try { await navigator.clipboard.writeText(data); toast("コピーしました。別の端末で「読み込む」に貼り付けてください"); }
  catch (e) { toast("コピーできませんでした"); }
}

/* ================================================================ 描画 */
const VIEWS = { day: vDay, meal: vMeal, train: vTrain, move: vMove, cal: vCal, chart: vChart, goal: vGoal, set: vSet };
const SUB = { meal: 1, train: 1, move: 1 };   /* 記録タブの下位ページ */
/* 保存できない環境では、気づかず使い続けないよう毎画面で警告を出す */
function storeBanner() {
  if (STORE_OK) return "";
  return `<div class="card" style="border-color:var(--crit)">
    <div class="card-b">
      <div class="note c">${IC.warn} <b>この開き方では記録が保存されません。</b>${esc(STORE_WHY)}。
      アプリを閉じると入力が消えます。<br>
      使い続けるなら、こまめに<b>設定 → データ → ファイルに書き出す</b>でバックアップを取ってください。
      PCのブラウザで開くか、Webサーバー上に置いた同じファイルを開けば保存されます。</div>
      <div class="row" style="margin-top:10px;gap:8px">
        <button class="btn acc sm" data-act="expFile">今すぐ書き出す</button>
        <button class="btn gh sm" data-nav="set">設定を開く</button>
      </div>
    </div>
  </div>`;
}
function render() {
  try {
    document.getElementById("view").innerHTML = storeBanner() + (VIEWS[VIEW] || vDay)();
    const on = SUB[VIEW] ? "day" : VIEW;
    document.querySelectorAll(".tab,.rail-item").forEach(b => {
      if (b.dataset.nav === on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    if (VIEW === "chart") bindCharts();
    applyTheme();
  } catch (e) {
    window.__fatal((e && e.message) || e, "画面: " + VIEW + " / " + ((e && e.stack) || "").split("\n").slice(0, 3).join(" | "));
  }
}
function applyTheme() {
  const t = S.set.theme;
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
}
function go(view) { VIEW = view; window.scrollTo(0, 0); render(); }

/* ================================================================ 操作 */
document.addEventListener("click", ev => {
  const nav = ev.target.closest("[data-nav]");
  if (nav) { go(nav.dataset.nav); return; }
  if (ev.target.closest("#barTheme,#railTheme")) {
    S.set.theme = S.set.theme === "auto" ? "dark" : S.set.theme === "dark" ? "light" : "auto";
    save(); render(); toast("テーマ: " + ({ auto: "端末に合わせる", dark: "ダーク", light: "ライト" })[S.set.theme]); return;
  }
  const g = ev.target.closest("[data-go]");
  if (g) { CUR = g.dataset.go; VIEW = "day"; window.scrollTo(0, 0); render(); return; }

  const a = ev.target.closest("[data-act]");
  if (!a) return;
  const act = a.dataset.act, i = a.dataset.i * 1;

  switch (act) {
    case "scrim": if (ev.target === a) closeSheet(); return;
    case "closeSheet": closeSheet(); return;
    case "back": go("day"); return;
    case "skipSetup": S.set.setupDone = 1; save(); closeSheet(); return;
    case "saveSetup": {
      const host = document.getElementById("sheetHost");
      const gv = k => { const e = host.querySelector(`[data-u="${k}"]`); return e ? e.value : ""; };
      const h = num(gv("height")), w = num(gv("w")), tw = num(gv("targetW"));
      if (h < 100 || h > 250) { toast("身長を確認してください"); return; }
      if (w < 25 || w > 250) { toast("現在の体重を確認してください"); return; }
      S.set.sex = gv("sex");
      if (gv("birth")) S.set.birth = gv("birth");
      S.set.height = h;
      S.goal.label = gv("label").trim() || "目標";
      if (gv("date")) S.goal.date = gv("date");
      S.goal.startW = w;
      S.goal.startDate = TODAY;
      S.goal.targetW = tw > 0 ? tw : r1(w * 0.96);
      /* 維持カロリーの初期値を体格から見積もる(基礎代謝 x 生活係数 x 運動ぶん) */
      S.goal.tdee = r0(bmrOf(w) * S.set.life * 1.18);
      S.set.setupDone = 1;
      edit(TODAY, d => { if (d.w == null) d.w = w; });
      save(); closeSheet(); go("day");
      toast(`設定しました。維持カロリーの目安は ${fmt(S.goal.tdee)} kcal です`);
      return;
    }
    case "redoSetup": S.set.setupDone = 0; save(); sheetSetup(); return;

    case "bodySheet": sheetBody(); return;
    case "memoSheet": sheetMemo(); return;
    case "pd": CUR = addD(CUR, -1); render(); return;
    case "nd": CUR = addD(CUR, 1); render(); return;
    case "today": CUR = TODAY; render(); return;
    case "pm": CALM = monthStart(addD(CALM, -1)); render(); return;
    case "nm": CALM = monthStart(addD(CALM, 32)); render(); return;
    case "span": CH.span = a.dataset.v; CH.anchor = CH.span === "week" ? weekStart(TODAY) : monthStart(TODAY); render(); return;
    case "pp": CH.anchor = CH.span === "week" ? addD(CH.anchor, -7) : monthStart(addD(monthStart(CH.anchor), -1)); render(); return;
    case "np": CH.anchor = CH.span === "week" ? addD(CH.anchor, 7) : monthStart(addD(monthStart(CH.anchor), 32)); render(); return;
    case "tbl": CH.tables[a.dataset.id] = !CH.tables[a.dataset.id]; render(); return;
    case "theme": S.set.theme = a.dataset.v; save(); render(); return;
    case "life": S.set.life = num(a.dataset.v); save(); render(); return;
    case "share": S.goal.actShare = num(a.dataset.v); save(); render(); return;
    case "bonusAuto": S.goal.bonusAuto = a.dataset.v === "1" ? 1 : 0; save(); render(); return;
    case "toggleTd": edit(CUR, d => { d.td = !calc(CUR).isTrain ? 1 : 0; }); render(); return;

    case "addFood": sheetFood(a.dataset.slot); return;
    case "pickFood": SH.sel = allFoods().find(f => f.n === a.dataset.n); SH.g = (SH.sel.u && SH.sel.u[0]) ? SH.sel.u[0][1] : 100; SH.ql = (SH.sel.u && SH.sel.u[0]) ? SH.sel.u[0][0] : null; drawSheet(); return;
    case "backFood": SH.sel = null; drawSheet(); return;
    case "unit": { const u = SH.sel.u[i]; SH.g = u[1]; SH.ql = u[0]; drawSheet(); return; }
    case "favFood": { const n = SH.sel.n, x = S.fav.f.indexOf(n); x < 0 ? S.fav.f.unshift(n) : S.fav.f.splice(x, 1); save(); drawSheet(); return; }
    case "saveFood": {
      const host = document.getElementById("sheetHost");
      const gg = num(host.querySelector("[data-fg]").value);
      const slot = host.querySelector("[data-fslot]").value;
      if (gg <= 0) { toast("重量を入れてください"); return; }
      const f = SH.sel, r = gg / 100;
      const q = SH.ql && Math.abs(SH.g - gg) < 0.01 ? SH.ql : r0(gg) + "g";
      edit(CUR, d => d.meals.push({ n: f.n, g: gg, q, slot, kcal: f.kcal * r, p: f.p * r, f: f.f * r, cb: f.cb * r, s: (f.s || 0) * r }));
      closeSheet(); render(); toast(`${f.n} を追加`); return;
    }
    case "delMeal": edit(CUR, d => d.meals.splice(i, 1)); render(); return;

    case "quickFood": sheetQuick(a.dataset.slot || (SH && SH.slot) || "s"); return;
    case "saveQuick": {
      const v = quickVals();
      if (v.kcal <= 0) { toast("カロリー、または P/F/C を入れてください"); return; }
      const n = v.n || "直接入力";
      edit(CUR, d => d.meals.push({ n, g: 0, q: "直接入力", slot: v.slot, kcal: v.kcal, p: v.p, f: v.f, cb: v.cb, s: v.s }));
      closeSheet(); render(); toast(`${n} ${fmt(v.kcal)} kcal を追加`); return;
    }

    case "addLift": sheetLift(null); return;
    case "editLift": sheetLift(i); return;
    case "pickLift": { const f = LIFTS.find(x => x.n === a.dataset.n); SH.sel = f; SH.sets = []; drawSheet(); return; }
    case "backLift": SH.sel = null; SH.sets = []; drawSheet(); return;
    case "favLift": { const n = SH.sel.n, x = S.fav.l.indexOf(n); x < 0 ? S.fav.l.unshift(n) : S.fav.l.splice(x, 1); save(); drawSheet(); return; }
    case "ph": pullSets(); SH.ph = a.dataset.v === "1" ? 1 : 0; drawSheet(); return;
    case "bulkAdd": {
      pullSets();
      const host = document.getElementById("sheetHost");
      const bv = k => num(host.querySelector(`[data-bulk="${k}"]`).value);
      const kg = bv("kg"), rep = bv("rep"), n = cl(r0(bv("set")), 1, 20);
      if (rep <= 0) { toast("回数を入れてください"); return; }
      /* 空の行しか無ければ置き換え、入力済みなら後ろに足す */
      const empty = SH.sets.every(s => !num(s.kg) && !num(s.rep));
      if (empty) SH.sets = [];
      for (let i = 0; i < n; i++) SH.sets.push({ kg: kg || "", rep });
      drawSheet(); return;
    }
    case "addSet": pullSets(); SH.sets.push({ kg: SH.sets.length ? SH.sets[SH.sets.length - 1].kg : "", rep: "" }); drawSheet(); return;
    case "delSet": pullSets(); SH.sets.splice(i, 1); if (!SH.sets.length) SH.sets = [{ kg: "", rep: "" }]; drawSheet(); return;
    case "saveLift": {
      pullSets();
      const sets = SH.sets.filter(s => num(s.kg) > 0 || num(s.rep) > 0).map(s => ({ kg: num(s.kg), rep: num(s.rep) }));
      if (!sets.length) { toast("重量と回数を入れてください"); return; }
      const rec = { n: SH.sel.n, met: SH.sel.met, sets, ph: SH.ph ? 1 : 0 };
      edit(CUR, d => { if (SH.editIdx == null) d.lifts.push(rec); else d.lifts[SH.editIdx] = rec; if (d.td == null) d.td = 1; });
      closeSheet(); render(); toast(`${rec.n} を記録`); return;
    }
    case "delLift": edit(CUR, d => d.lifts.splice(i, 1)); render(); return;

    case "addAct": sheetAct(); return;
    case "pickAct": SH.sel = SPORTS.find(x => x.n === a.dataset.n); drawSheet(); return;
    case "backAct": SH.sel = null; drawSheet(); return;
    case "favAct": { const n = SH.sel.n, x = S.fav.a.indexOf(n); x < 0 ? S.fav.a.unshift(n) : S.fav.a.splice(x, 1); save(); drawSheet(); return; }
    case "saveAct": {
      const m = num(document.querySelector("[data-amin]").value);
      if (m <= 0) { toast("時間を入れてください"); return; }
      const s = SH.sel;
      edit(CUR, d => d.acts.push({ n: s.n, met: s.met, amb: s.amb, min: m }));
      closeSheet(); render(); toast(`${s.n} ${m}分 を追加`); return;
    }
    case "delAct": edit(CUR, d => d.acts.splice(i, 1)); render(); return;

    case "addInc": sheetInc(); return;
    case "saveInc": {
      const host = document.getElementById("sheetHost");
      const gv = num(host.querySelector('[data-inc="g"]').value);
      const spKmh = num(host.querySelector('[data-inc="sp"]').value);
      const mn = num(host.querySelector('[data-inc="min"]').value);
      if (spKmh <= 0 || mn <= 0) { toast("速度と時間を入れてください"); return; }
      /* 保存は m/s。過去の記録と同じ形式にそろえる */
      edit(CUR, d => d.inc.push({ g: gv, sp: kmh2ms(spKmh), min: mn }));
      closeSheet(); render(); toast("傾斜ウォークを追加"); return;
    }
    case "delInc": edit(CUR, d => d.inc.splice(i, 1)); render(); return;

    case "newMyFood": sheetMyFood(); return;
    case "saveMyFood": {
      const host = document.getElementById("sheetHost");
      const gv = k => host.querySelector(`[data-mf="${k}"]`).value;
      const n = gv("n").trim();
      if (!n) { toast("食品名を入れてください"); return; }
      if (allFoods().some(f => f.n === n)) { toast("同じ名前があります"); return; }
      const un = gv("un").trim(), ug = num(gv("ug"));
      S.my.unshift({ n, c: "マイ食品", kcal: num(gv("kcal")), p: num(gv("p")), f: num(gv("f")), cb: num(gv("cb")), s: num(gv("s")), u: un && ug > 0 ? [[un, ug]] : [] });
      save(); closeSheet(); render(); toast(`${n} を登録`); return;
    }
    case "delMyFood": S.my.splice(i, 1); save(); render(); return;

    case "mySets": sheetMySets(); return;
    case "saveSet": {
      const nm = document.querySelector("[data-setname]").value.trim() || `セット${S.sets.length + 1}`;
      S.sets.unshift({ n: nm, items: day(CUR).meals.map(m => Object.assign({}, m)) });
      save(); drawSheet(); toast("保存しました"); return;
    }
    case "useSet": { const s = S.sets[i]; edit(CUR, d => { for (const m of s.items) d.meals.push(Object.assign({}, m)); }); closeSheet(); render(); toast(`${s.n} を入れました`); return; }
    case "delSet2": S.sets.splice(i, 1); save(); drawSheet(); return;

    case "applyMenu": {
      const items = buildMenu(a.dataset.t === "1");
      edit(CUR, d => { for (const m of items) d.meals.push(Object.assign({}, m)); if (d.td == null) d.td = a.dataset.t === "1" ? 1 : 0; });
      VIEW = "day"; window.scrollTo(0, 0); render(); toast("メニューを入れました"); return;
    }
    case "tdeeFromLog": {
      const ks = Object.keys(S.days).filter(k => k <= TODAY && calc(k).logged).sort().slice(-14);
      if (ks.length < 3) { toast("記録が3日以上たまってからにしてください"); return; }
      const avg = ks.reduce((s, k) => s + calc(k).burn, 0) / ks.length;
      S.goal.tdee = r0(avg); save(); render(); toast(`維持カロリーを直近${ks.length}日の平均 ${fmt(avg)} kcal に更新`); return;
    }
    case "copyPrev": {
      const p = day(addD(CUR, -1));
      if (!hasData(p)) { toast("前日の記録がありません"); return; }
      edit(CUR, d => {
        d.meals = p.meals.map(x => Object.assign({}, x));
        d.lifts = p.lifts.map(x => Object.assign({}, x, { sets: x.sets.map(s => Object.assign({}, s)) }));
        d.acts = p.acts.map(x => Object.assign({}, x));
        d.inc = p.inc.map(x => Object.assign({}, x));
        d.steps = p.steps; d.td = p.td;
      });
      render(); toast("前日をコピーしました"); return;
    }
    case "clearDay": {
      if (!confirm(`${CUR} の記録をすべて消します。よろしいですか?`)) return;
      delete S.days[CUR]; save(); render(); toast("空にしました"); return;
    }
    case "expFile": expFile(); return;
    case "expClip": expClip(); return;
    case "impOpen": sheetImport(); return;
    case "doImport": {
      const t = document.querySelector("[data-imptext]").value.trim();
      if (!t) { toast("貼り付けるか、ファイルを選んでください"); return; }
      try { const n = mergeIn(JSON.parse(t)); closeSheet(); render(); toast(`${n}日ぶんを読み込みました`); }
      catch (e) { toast("読み込めません: " + e.message); }
      return;
    }
    case "wipe": {
      if (!confirm("すべての記録と設定を削除します。取り消せません。よろしいですか?")) return;
      localStorage.removeItem(LSK); S = DEF(); normalizeGoal(); DATA_STAMP++; save(); CUR = TODAY; render(); if (!S.set.setupDone) sheetSetup(); toast("削除しました"); return;
    }
  }
});

function pullSets() {
  document.querySelectorAll("[data-set]").forEach(el => {
    const i = el.dataset.set * 1;
    if (SH.sets[i]) SH.sets[i][el.dataset.fld] = el.value;
  });
}

/* 入力の反映 */
document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.dataset.in) {
    const k = el.dataset.in;
    if (k === "steps") edit(CUR, d => { d.steps = Math.max(0, r0(num(el.value))); });
    else if (k === "trainMin") edit(CUR, d => { d.trainMin = Math.max(0, r0(num(el.value))); });
    else if (k === "w") edit(CUR, d => { d.w = el.value === "" ? null : num(el.value); });
    else if (k === "bf") edit(CUR, d => { d.bf = el.value === "" ? null : num(el.value); });
    else if (k === "note") edit(CUR, d => { d.note = el.value; });
    render(); return;
  }
  if (el.dataset.s === "stepSpeedKmh") {
    S.set.stepSpeed = kmh2ms(el.value);
    save(); render(); return;
  }
  if (el.dataset.s) {
    const k = el.dataset.s;
    S.set[k] = (k === "sex" || k === "birth" || k === "bmrF" || k === "theme") ? el.value : num(el.value);
    save(); render(); return;
  }
  if (el.dataset.g) {
    const k = el.dataset.g;
    S.goal[k] = (k === "label" || k === "date") ? el.value : num(el.value);
    save(); render(); return;
  }
  if (el.dataset.impfile) {
    const f = el.files && el.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { const n = mergeIn(JSON.parse(rd.result)); closeSheet(); render(); toast(`${n}日ぶんを読み込みました`); } catch (e) { toast("読み込めません: " + e.message); } };
    rd.readAsText(f);
  }
});

/* シート内のライブプレビュー */
document.addEventListener("input", ev => {
  const el = ev.target;
  if (!SH) return;
  if (el.dataset.q1) { quickPreview(); return; }
  if (el.dataset.fg && SH.sel) {
    const gg = num(el.value), f = SH.sel, r = gg / 100;
    const p = document.querySelector("[data-prev]");
    if (p) p.textContent = `${fmt(f.kcal * r)} kcal / P${r1(f.p * r)} F${r1(f.f * r)} C${r1(f.cb * r)}`;
    if (SH.ql && Math.abs(gg - SH.g) > 0.01) { SH.ql = null; document.querySelectorAll('[data-act="unit"]').forEach(b => b.setAttribute("aria-pressed", "false")); }
  }
  if (el.dataset.amin && SH.sel) {
    const m = num(el.value), w = weightAt(CUR), a = SH.sel;
    const p = document.querySelector("[data-aprev]");
    if (p) p.innerHTML = `推定消費 <b>${fmt(kcalMet(a.met, w, m))} kcal</b>${a.amb ? ` · 推定 ${actSteps({ amb: 1, met: a.met, min: m }).toLocaleString("ja-JP")} 歩` : ""}`;
  }
  if (el.dataset.inc) {
    SH[el.dataset.inc] = num(el.value);
    const w = weightAt(CUR), r = incCalc({ g: SH.g, sp: kmh2ms(SH.sp), min: SH.min }, w);
    const p = document.querySelector("[data-incprev]");
    if (p) p.innerHTML = `キロ${paceStr(SH.sp)} のペース · 距離 ${r1(r.dist)} km · ${r1(r.met)} METs · 推定 ${r.steps.toLocaleString("ja-JP")} 歩<br>推定消費 <b>${fmt(r.kcal)} kcal</b>(${r.run ? "走行式" : "歩行式"}・安静分を除いた純消費)`;
  }
});

/* キーボード */
document.addEventListener("keydown", ev => {
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const t = ev.target.tagName;
  if (t === "INPUT" || t === "TEXTAREA" || t === "SELECT") return;
  if (SH) { if (ev.key === "Escape") { closeSheet(); } return; }
  if (VIEW !== "day" && !SUB[VIEW]) return;
  if (ev.key === "ArrowLeft") { CUR = addD(CUR, -1); render(); }
  else if (ev.key === "ArrowRight") { CUR = addD(CUR, 1); render(); }
  else if (ev.key === "t" || ev.key === "T") { CUR = TODAY; render(); }
  else if (ev.key === "Escape" && SUB[VIEW]) go("day");
});

/* スワイプ */
(function () {
  let x0 = null, y0 = null;
  const v = document.getElementById("view");
  v.addEventListener("touchstart", e => { if (e.touches.length !== 1) return; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  v.addEventListener("touchend", e => {
    if (x0 == null || SH) { x0 = null; return; }
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (VIEW !== "day" && !SUB[VIEW]) return;
    if (Math.abs(dx) > 62 && Math.abs(dx) > Math.abs(dy) * 1.7) { CUR = addD(CUR, dx < 0 ? 1 : -1); render(); }
  }, { passive: true });
})();

/* 初期化 */
if (window.__step) window.__step("b4", "OK");
applyTheme();
render();
if (!S.set.setupDone) sheetSetup();
</script>

</body>
</html>
