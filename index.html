<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf6f0">
<title>人間ビンゴ</title>
<style>
:root{
  --bg:#fdf6f0;
  --paper:#fffdfb;
  --ink:#5a4a42;
  --muted:#9a8a82;
  --rose:#f3d4d8;
  --rose-deep:#d48f96;
  --rose-ink:#b8656e;
  --gold:#c9a96e;
  --gold-soft:#f1e5cc;
  --sage:#d8e3d4;
  --sky:#dde6ef;
  --line:#ecdcd5;
  --cell:#ffffff;
  --cell-done:#fbe6e9;
  --danger:#c75b5b;
  --groom:#5f7fa8;
  --groom-soft:#e3ebf5;
  --bride:#c76d84;
  --bride-soft:#fae3e9;
  --shadow:0 2px 12px rgba(120,80,70,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;}
body{min-height:100vh;}
button{font-family:inherit;color:inherit}
input{font-family:inherit}
.app{max-width:520px;margin:0 auto;padding:10px 12px 40px;}

/* ===== ヘッダー ===== */
header{text-align:center;padding:6px 0 2px;user-select:none;-webkit-user-select:none}
.title{font-size:24px;margin:0;letter-spacing:.1em;font-weight:600;color:var(--rose-ink);
  line-height:1.3;cursor:default;display:inline-block;padding:6px 10px;}
.title small{display:block;font-size:11px;letter-spacing:.3em;color:var(--gold);font-weight:500}
.cardid{margin:2px 0 4px;font-size:13px;color:var(--muted);letter-spacing:.05em}
.cardid b{color:var(--ink);font-size:16px;letter-spacing:.15em;font-variant-numeric:tabular-nums}
.me{font-size:13px;color:var(--ink);margin-bottom:8px}
.me b{font-weight:700}
.toolbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;
  font-size:13px;min-height:44px;display:inline-flex;align-items:center;gap:6px;box-shadow:var(--shadow);cursor:pointer}
.chip.bingo{background:var(--gold-soft);border-color:var(--gold);color:#7a5a1e;font-weight:600}
.progress{font-size:12px;color:var(--muted);text-align:center;margin-bottom:8px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;vertical-align:middle;white-space:nowrap}
.badge.groom{background:var(--groom-soft);color:var(--groom)}
.badge.bride{background:var(--bride-soft);color:var(--bride)}
.badge.couple{background:var(--gold-soft);color:#7a5a1e}

/* ===== グリッド ===== */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;}
.cell{position:relative;appearance:none;border:1px solid var(--line);background:var(--cell);border-radius:10px;
  min-height:72px;padding:6px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;cursor:pointer;box-shadow:0 1px 3px rgba(120,80,70,.08);transition:transform .08s;}
.cell:active{transform:scale(.96)}
.cell .task{font-size:11px;line-height:1.25;word-break:break-all;line-break:anywhere;overflow-wrap:anywhere;color:var(--ink)}
.cell.done{background:var(--cell-done);border-color:var(--rose)}
.cell.done .task{font-size:9px;color:var(--muted);line-height:1.15}
.cell .name{display:block;margin-top:3px;font-size:12px;font-weight:700;color:var(--rose-ink);word-break:break-all;line-height:1.2}
.cell .mark{position:absolute;top:2px;right:4px;font-size:10px;color:var(--rose-deep)}
.cell .star{position:absolute;top:1px;left:4px;font-size:10px;color:var(--gold)}
.cell.cat-couple{border-color:var(--gold);background:#fffaf0}
.cell.cat-couple.done{background:#f9ecd9}
.cell.cat-know{background:#f7faf6}
.cell.cat-today{background:#f6f8fb}
.cell.cat-know.done,.cell.cat-today.done{background:var(--cell-done)}
.legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.legend .l-self::before{background:#fff}
.legend .l-today::before{background:#f6f8fb}
.legend .l-know::before{background:#f7faf6}
.legend .l-couple::before{background:#fffaf0;border-color:var(--gold)}

/* ===== オーバーレイ / モーダル ===== */
.overlay{position:fixed;inset:0;background:rgba(80,50,45,.45);display:none;align-items:center;justify-content:center;
  padding:16px;overflow:auto;z-index:50;-webkit-overflow-scrolling:touch}
.overlay.show{display:flex}
.modal{background:var(--paper);border-radius:18px;width:100%;max-width:440px;padding:20px 18px;box-shadow:0 10px 40px rgba(60,30,30,.3);
  margin:auto;max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column}
.modal h2{margin:0 0 10px;font-size:18px;color:var(--rose-ink);font-weight:600;text-align:center;letter-spacing:.05em}
.modal .task-big{font-size:17px;font-weight:600;text-align:center;background:var(--rose);border-radius:10px;padding:10px;margin-bottom:12px;line-height:1.4}
.modal label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
.modal input[type=text],.modal input[type=password],.modal input[type=search]{width:100%;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:44px;outline:none}
.modal input:focus{border-color:var(--rose-deep)}
.hint{font-size:12px;color:var(--muted);text-align:center;margin:6px 0}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:8px 0 0;text-align:center}
.btnrow{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;min-height:48px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;padding:10px}
.btn.primary{background:var(--rose-deep);color:#fff}
.btn.secondary{background:#f1e8e4;color:var(--ink)}
.btn.danger{background:#fff;color:var(--danger);border:1px solid var(--danger)}
.btn.gold{background:var(--gold);color:#fff}
.btn.block{width:100%;flex:none;margin-top:10px}
.viewname{text-align:center;font-size:22px;font-weight:700;color:var(--rose-ink);margin:10px 0 4px}
.viewtime{text-align:center;font-size:12px;color:var(--muted)}

/* ===== 名簿リスト ===== */
.segment{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:8px}
.segment button{flex:1;min-height:44px;border:none;background:#fff;font-size:14px;cursor:pointer}
.segment button.on{background:var(--rose-deep);color:#fff;font-weight:600}
.segment button.on.groom{background:var(--groom)}
.segment button.on.bride{background:var(--bride)}
.list{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:8px;-webkit-overflow-scrolling:touch}
.list.tall{max-height:52vh}
.list.mid{max-height:40vh}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:8px 12px;border:none;border-bottom:1px solid var(--line);background:#fff;text-align:left;font-size:16px;cursor:pointer}
.row:last-child{border-bottom:none}
.row:active{background:var(--rose)}
.row .n{flex:1;font-weight:600}
.row .k{font-size:11px;color:var(--muted);font-weight:400;margin-left:6px}
.row.dim{color:#b9aca6}
.row.dim .n{font-weight:400}
.row.used{color:#b9aca6;background:#faf6f3;cursor:default}
.row.used .n{font-weight:400}
.row .sub{font-size:11px;color:var(--muted)}
.row.hdr{min-height:30px;padding:4px 12px;font-size:11px;color:var(--muted);background:#faf6f3;cursor:default}
.empty{padding:20px;text-align:center;color:var(--muted);font-size:14px}

/* ===== ルール ===== */
.rules ol{padding-left:22px;margin:0;font-size:15px;line-height:1.7}
.rules li{margin-bottom:6px}
.rules .note{font-size:12px;color:var(--muted);margin-top:10px;text-align:center}

/* ===== BINGO 画面 ===== */
.bingo-screen{position:fixed;inset:0;background:linear-gradient(160deg,#fff4ea 0%,#fbe3e7 55%,#f6e9d2 100%);display:none;z-index:60;overflow:auto;padding:24px 16px 40px}
.bingo-screen.show{display:block}
.bingo-inner{max-width:440px;margin:0 auto;text-align:center}
.bingo-word{font-size:56px;font-weight:800;letter-spacing:.15em;color:var(--rose-ink);margin:10px 0 0;text-shadow:0 3px 0 #fff,0 6px 16px rgba(200,120,130,.35);animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.bingo-sub{font-size:14px;color:var(--muted);letter-spacing:.3em}
.bingo-time{font-size:40px;font-weight:700;margin:12px 0 2px;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.05em}
.bingo-who{font-size:20px;font-weight:700;color:var(--rose-ink);margin:4px 0}
.bingo-meta{font-size:14px;color:var(--muted)}
.bingo-meta b{color:var(--ink);font-size:18px;letter-spacing:.15em}
.bingo-msg{margin:14px 0;font-size:15px;background:#fff;border-radius:12px;padding:12px;box-shadow:var(--shadow);line-height:1.5}
.bingo-msg small{color:var(--rose-ink);font-weight:600;font-size:13px}
.bingo-lines{text-align:left}
.bingo-line-title{font-size:13px;color:var(--gold);font-weight:600;margin:14px 0 6px;letter-spacing:.1em}
.sigcard{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
.sigcard .meta{flex:1;min-width:0}
.sigcard .t{font-size:11px;color:var(--muted);word-break:break-all;line-height:1.2}
.sigcard .n{font-size:16px;font-weight:700;color:var(--rose-ink);word-break:break-all}
.flash{position:fixed;inset:0;background:#fff;pointer-events:none;z-index:65;animation:flash 1.1s ease-out forwards}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:64;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;opacity:.9;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0deg)}100%{transform:translateY(110vh) rotate(720deg)}}

/* ===== 幹事メニュー ===== */
.menu .btn{margin-top:10px}
.menu .status{font-size:13px;color:var(--muted);text-align:center;margin-bottom:4px;line-height:1.5}
.pin-input{text-align:center;letter-spacing:.4em;font-size:22px!important}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(80,50,45,.9);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;
  opacity:0;pointer-events:none;transition:opacity .25s;z-index:70;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}

@media (min-width:600px){
  .cell{min-height:84px}
  .cell .task{font-size:12px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 class="title" id="title"><small>WEDDING PARTY</small>人間ビンゴ</h1>
    <div class="cardid">カードID <b id="cardId">------</b></div>
    <div class="me" id="meLine"></div>
    <div class="toolbar">
      <button class="chip" id="btnRules" type="button">📖 ルール</button>
      <button class="chip bingo" id="btnBingoAgain" type="button" style="display:none">🎉 BINGO達成を表示</button>
    </div>
    <div class="progress" id="progress"></div>
  </header>

  <div class="grid" id="grid" aria-label="ビンゴカード"></div>
  <div class="legend">
    <span class="l-self">自分のこと</span>
    <span class="l-today">今日の行動</span>
    <span class="l-know">新郎新婦を知ってる</span>
    <span class="l-couple">新郎新婦本人</span>
  </div>
</div>

<!-- あなたは誰？ -->
<div class="overlay" id="ovWho">
  <div class="modal">
    <h2>あなたは誰？</h2>
    <div class="hint">自分の名前を選んでください(名前の一部やひらがなでも検索できます)</div>
    <input type="search" id="whoSearch" placeholder="名前で検索" autocomplete="off">
    <div class="list tall" id="whoList"></div>
  </div>
</div>

<!-- 該当者を選ぶ -->
<div class="overlay" id="ovPick">
  <div class="modal">
    <div class="task-big" id="pickTask"></div>
    <div class="segment" id="pickSeg">
      <button type="button" data-side="groom">新郎側</button>
      <button type="button" data-side="bride">新婦側</button>
    </div>
    <input type="search" id="pickSearch" placeholder="名前で検索" autocomplete="off">
    <div class="list mid" id="pickList"></div>
    <button type="button" class="btn secondary block" id="pickCancel">やめる</button>
  </div>
</div>

<!-- 登録済みマス -->
<div class="overlay" id="ovView">
  <div class="modal">
    <div class="task-big" id="viewTask"></div>
    <div class="viewname" id="viewName"></div>
    <div class="viewtime" id="viewTime"></div>
    <div class="btnrow">
      <button type="button" class="btn danger" id="viewDelete">取り消す</button>
      <button type="button" class="btn primary" id="viewClose">閉じる</button>
    </div>
  </div>
</div>

<!-- ルール -->
<div class="overlay" id="ovRules">
  <div class="modal rules">
    <h2>あそびかた</h2>
    <ol id="rulesList"></ol>
    <div class="note" id="rulesNote"></div>
    <button type="button" class="btn primary block" id="rulesOk">はじめる</button>
  </div>
</div>

<!-- 暗証番号 -->
<div class="overlay" id="ovPin">
  <div class="modal">
    <h2>幹事メニュー</h2>
    <label for="pinInput">暗証番号</label>
    <input type="password" id="pinInput" class="pin-input" inputmode="numeric" autocomplete="off" maxlength="8">
    <div class="err" id="pinErr"></div>
    <div class="btnrow">
      <button type="button" class="btn secondary" id="pinCancel">やめる</button>
      <button type="button" class="btn primary" id="pinOk">OK</button>
    </div>
  </div>
</div>

<!-- 幹事メニュー -->
<div class="overlay" id="ovMenu">
  <div class="modal menu">
    <h2>幹事メニュー</h2>
    <div class="status" id="menuStatus"></div>
    <button type="button" class="btn secondary block" id="menuWho">👤 自分の名前を選び直す</button>
    <button type="button" class="btn gold block" id="menuRegen">🔄 カードを作り直す</button>
    <button type="button" class="btn secondary block" id="menuWin">勝利条件を切り替える</button>
    <button type="button" class="btn danger block" id="menuWipe">🗑 全データ削除</button>
    <button type="button" class="btn secondary block" id="menuClose">閉じる</button>
  </div>
</div>

<!-- 確認 -->
<div class="overlay" id="ovConfirm">
  <div class="modal">
    <h2 id="confirmTitle">確認</h2>
    <div id="confirmMsg" style="text-align:center;font-size:15px;line-height:1.6"></div>
    <div class="btnrow">
      <button type="button" class="btn secondary" id="confirmNo">やめる</button>
      <button type="button" class="btn primary" id="confirmYes">OK</button>
    </div>
  </div>
</div>

<!-- BINGO -->
<div class="bingo-screen" id="bingoScreen">
  <div class="bingo-inner">
    <div class="bingo-sub">CONGRATULATIONS</div>
    <div class="bingo-word">BINGO!</div>
    <div class="bingo-time" id="bingoTime">--:--:--</div>
    <div class="bingo-who" id="bingoWho"></div>
    <div class="bingo-meta">達成時刻 ／ カードID <b id="bingoCardId">------</b></div>
    <div class="bingo-msg">集計のときにこの画面を司会に見せてください 🎤<br><small>達成時刻が早い人から順に景品！</small></div>
    <div class="bingo-lines" id="bingoLines"></div>
    <button type="button" class="btn secondary block" id="bingoClose">カードに戻る</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* =====================================================================
 *  ★ ここから設定(名簿・お題・暗証番号など)。編集するのは基本ここだけ ★
 * ===================================================================== */

// 幹事メニューの暗証番号(タイトルを5回連続タップで入力画面が出ます)
const ORGANIZER_PIN = "2026";

// 勝利条件の初期値: 1 = 1列そろったらBINGO / 2 = 2列そろったらBINGO
// (幹事メニューでも切り替えできますが、それはその端末だけに効きます)
const DEFAULT_WIN_LINES = 1;

// 新郎新婦(「新郎本人」「新婦本人」のお題にだけ出てきます)
const COUPLE = {
  groom: { name:"新郎", kana:"しんろう" },
  bride: { name:"新婦", kana:"しんぷ" },
};

// ゲスト名簿。side: "groom"=新郎側 / "bride"=新婦側。kana は検索用(ひらがな)。
// 同姓同名・同姓の人がいるときは name に「佐藤 健(高専)」のように補足を入れて区別してください。
const GUESTS = [
  // ---- 新郎側 ----
  { name:"山田 太郎",   kana:"やまだたろう",     side:"groom" },
  { name:"佐藤 健",     kana:"さとうけん",       side:"groom" },
  { name:"鈴木 一郎",   kana:"すずきいちろう",   side:"groom" },
  { name:"高橋 大輔",   kana:"たかはしだいすけ", side:"groom" },
  { name:"田中 翔",     kana:"たなかしょう",     side:"groom" },
  { name:"伊藤 拓也",   kana:"いとうたくや",     side:"groom" },
  { name:"渡辺 亮",     kana:"わたなべりょう",   side:"groom" },
  { name:"中村 悠斗",   kana:"なかむらゆうと",   side:"groom" },
  { name:"小林 直樹",   kana:"こばやしなおき",   side:"groom" },
  { name:"加藤 遼",     kana:"かとうりょう",     side:"groom" },
  { name:"吉田 彩",     kana:"よしだあや",       side:"groom" },
  { name:"山本 美咲",   kana:"やまもとみさき",   side:"groom" },
  { name:"松本 隼人",   kana:"まつもとはやと",   side:"groom" },
  { name:"井上 蓮",     kana:"いのうえれん",     side:"groom" },
  { name:"木村 大地",   kana:"きむらだいち",     side:"groom" },
  // ---- 新婦側 ----
  { name:"清水 花子",   kana:"しみずはなこ",     side:"bride" },
  { name:"森 結衣",     kana:"もりゆい",         side:"bride" },
  { name:"池田 さくら", kana:"いけださくら",     side:"bride" },
  { name:"橋本 美月",   kana:"はしもとみづき",   side:"bride" },
  { name:"山口 葵",     kana:"やまぐちあおい",   side:"bride" },
  { name:"石川 陽菜",   kana:"いしかわひな",     side:"bride" },
  { name:"斎藤 優子",   kana:"さいとうゆうこ",   side:"bride" },
  { name:"前田 真央",   kana:"まえだまお",       side:"bride" },
  { name:"藤田 里奈",   kana:"ふじたりな",       side:"bride" },
  { name:"岡田 凛",     kana:"おかだりん",       side:"bride" },
  { name:"後藤 翔太",   kana:"ごとうしょうた",   side:"bride" },
  { name:"長谷川 玲奈", kana:"はせがわれな",     side:"bride" },
  { name:"村上 恵",     kana:"むらかみめぐみ",   side:"bride" },
  { name:"近藤 千尋",   kana:"こんどうちひろ",   side:"bride" },
  { name:"遠藤 楓",     kana:"えんどうかえで",   side:"bride" },
];

// お題プール。各系統から count 個ずつランダムに選んで25マスにします(合計25になるように)。
//  ・文字列だけなら誰でも登録できるお題
//  ・{ t:"…", only:"opposite" } は自分と反対側のゲストだけ選べる
//  ・{ t:"…", only:"groom" / "bride" } は新郎/新婦本人だけ選べる
//  ・hard:true は「難しめ」の目印(画面には出ません。配分の管理用)
const POOLS = [
  { key:"self", label:"自分のこと(普通)", count:6, items:[
    "県外から来た",
    "群馬県民",
    "既婚者",
    "子どもがいる",
    "左利き",
    "ペットを飼っている",
    "お酒が飲めない",
    "車で来た",
    "新幹線で来た",
    "楽器ができる",
    "スポーツを今も続けている",
    "誕生月が自分と同じ",
    "海外に行ったことがある",
  ]},

const RULES = [
  "マスのお題に該当する人を探して、本人に確認してからそのマスに登録(名前をタップ)",
  "同じ人を登録できるのは1マスまで。自分は登録できません",

  "ズルはなし！ 本人に聞いてから登録してね",
];
const RULES_NOTE = "カードは人それぞれ違います。閉じても同じブラウザで開けば同じカードが出ます(LINEのQRリーダーではなく、スマホ標準のカメラで読んでね)";

/* =====================================================================
 *  ここから下はプログラム本体
 * ===================================================================== */

const LS = {
  seed:"hbingo.seed", cells:"hbingo.cells", bingo:"hbingo.bingo",
  win:"hbingo.winLines", rules:"hbingo.rulesSeen", me:"hbingo.me",
};
const SIDE_LABEL = { groom:"新郎側", bride:"新婦側" };

const $ = (id)=>document.getElementById(id);

// ---------- 名簿 ----------
const PEOPLE = []; // {name, kana, side, role}
GUESTS.forEach(g=>PEOPLE.push({ name:g.name, kana:g.kana||"", side:g.side, role:"guest" }));
PEOPLE.push({ name:COUPLE.groom.name, kana:COUPLE.groom.kana||"", side:"groom", role:"couple" });
PEOPLE.push({ name:COUPLE.bride.name, kana:COUPLE.bride.kana||"", side:"bride", role:"couple" });
const byName = (n)=>PEOPLE.find(p=>p.name===n) || null;

function normText(s){
  return (s||"").normalize("NFKC").replace(/[\s　]+/g,"").toLowerCase()
    .replace(/[ァ-ヶ]/g, ch=>String.fromCharCode(ch.charCodeAt(0)-0x60)); // カタカナ→ひらがな
}
function matches(p, q){
  if(!q) return true;
  return normText(p.name).includes(q) || normText(p.kana).includes(q);
}

// ---------- 乱数(seed固定) ----------
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rng){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(rng()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function newSeed(){
  if(window.crypto && crypto.getRandomValues){
    const u = new Uint32Array(1); crypto.getRandomValues(u); return u[0] >>> 0;
  }
  return Math.floor(Math.random()*4294967296) >>> 0;
}
function cardIdOf(seed){
  const r = mulberry32(seed ^ 0x9E3779B9);
  return String(Math.floor(r()*1000000)).padStart(6,"0");
}

// ---------- カード生成 ----------
function buildCard(seed){
  const rng = mulberry32(seed);
  let total = 0;
  for(const p of POOLS){
    total += p.count;
    if(p.items.length < p.count){
      throw new Error(`お題「${p.label}」が不足しています(${p.items.length}個、必要${p.count}個)`);
    }
  }
  if(total !== 25) throw new Error(`お題の合計が25ではありません(${total})`);
  const dup = new Set(GUESTS.map(g=>g.name));
  if(dup.size !== GUESTS.length) throw new Error("名簿に同じ名前が2回あります。区別できるように補足を付けてください");
  let items = [];
  for(const p of POOLS){
    const picked = shuffle(p.items.slice(), rng).slice(0, p.count);
    items.push(...picked.map(it=>{
      const o = (typeof it === "string") ? { text:it } : { text:it.t, only:it.only };
      o.cat = p.key; o.hard = !!p.hard; return o;
    }));
  }
  return shuffle(items, rng);
}

// ---------- ストレージ ----------
function load(key, fallback){
  try{ const v = localStorage.getItem(key); return v===null ? fallback : JSON.parse(v); }
  catch(e){ return fallback; }
}
function save(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch(e){ toast("保存できませんでした"); return false; }
}
function remove(key){ try{ localStorage.removeItem(key); }catch(e){} }

// ---------- 判定 ----------
const LINES = (()=>{
  const L = [];
  for(let r=0;r<5;r++) L.push([0,1,2,3,4].map(c=>r*5+c));
  for(let c=0;c<5;c++) L.push([0,1,2,3,4].map(r=>r*5+c));
  L.push([0,6,12,18,24]);
  L.push([4,8,12,16,20]);
  return L;
})();
function lineName(idx){
  if(idx<5) return `横 ${idx+1}行目`;
  if(idx<10) return `縦 ${idx-5+1}列目`;
  return idx===10 ? "斜め(左上→右下)" : "斜め(右上→左下)";
}
function completedLineIdx(cells){
  const out = [];
  LINES.forEach((l,i)=>{ if(l.every(k=>cells[k])) out.push(i); });
  return out;
}

// ---------- 状態 ----------
const state = { seed:null, card:[], cells:{}, bingo:null, winLines:DEFAULT_WIN_LINES, me:null };

function init(){
  let seed = load(LS.seed, null);
  if(typeof seed !== "number"){ seed = newSeed(); save(LS.seed, seed); }
  state.seed = seed;
  state.card = buildCard(seed);
  state.cells = load(LS.cells, {}) || {};
  state.bingo = load(LS.bingo, null);
  const w = load(LS.win, null);
  state.winLines = (w===1||w===2) ? w : DEFAULT_WIN_LINES;
  const meName = load(LS.me, null);
  state.me = meName ? byName(meName) : null;
  if(meName && !state.me){ remove(LS.me); } // 名簿から消えた
  // 保存データの整合(名簿から消えた人など)
  for(const k of Object.keys(state.cells)){
    const i = +k, c = state.cells[k];
    if(!(i>=0 && i<25) || !c || !c.name || !byName(c.name)) delete state.cells[k];
  }
  renderAll();
  if(!load(LS.rules, false)) openRules(true);
  else if(!state.me) openWho();
}

// ---------- 描画 ----------
function renderAll(){
  $("cardId").textContent = cardIdOf(state.seed);
  renderGrid();
  renderHeader();
}
function renderGrid(){
  const g = $("grid");
  g.innerHTML = "";
  state.card.forEach((item, i)=>{
    const b = document.createElement("button");
    b.type = "button";
    b.className = "cell cat-" + item.cat;
    const c = state.cells[i];
    const star = ""; // 難しめの印は出さない(hard フラグは配分にだけ使う)
    if(c){
      b.classList.add("done");
      b.innerHTML = `${star}<span class="mark">✓</span><span class="task"></span><span class="name"></span>`;
      b.querySelector(".task").textContent = item.text;
      b.querySelector(".name").textContent = c.name;
      b.setAttribute("aria-label", `${item.text} ${c.name} 登録済み`);
    }else{
      b.innerHTML = `${star}<span class="task"></span>`;
      b.querySelector(".task").textContent = item.text;
      b.setAttribute("aria-label", item.text);
    }
    b.addEventListener("click", ()=>{
      if(!state.me){ openWho(); return; }
      state.cells[i] ? openView(i) : openPick(i);
    });
    g.appendChild(b);
  });
}
function renderHeader(){
  const n = Object.keys(state.cells).length;
  const lines = completedLineIdx(state.cells).length;
  $("progress").textContent = `登録 ${n} / 25　そろった列 ${lines}　(${state.winLines}列でBINGO)`;
  $("btnBingoAgain").style.display = state.bingo ? "" : "none";
  const m = $("meLine");
  if(state.me){
    m.innerHTML = `あなた: <b></b> <span class="badge"></span>`;
    m.querySelector("b").textContent = state.me.name;
    const bd = m.querySelector(".badge"); bd.classList.add(state.me.side); bd.textContent = SIDE_LABEL[state.me.side];
  }else{
    m.textContent = "";
  }
}

// ---------- オーバーレイ共通 ----------
function show(id){ $(id).classList.add("show"); }
function hide(id){ $(id).classList.remove("show"); }
let toastTimer = null;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}
function confirmDialog(title, msg, onYes, yesLabel, noLabel){
  $("confirmTitle").textContent = title;
  $("confirmMsg").textContent = msg;
  const yes = $("confirmYes"), no = $("confirmNo");
  yes.textContent = yesLabel || "OK"; no.textContent = noLabel || "やめる";
  show("ovConfirm");
  const cleanup = ()=>{ hide("ovConfirm"); yes.onclick = null; no.onclick = null; };
  yes.onclick = ()=>{ cleanup(); onYes(); };
  no.onclick = cleanup;
}
function personRow(p, opts){
  const b = document.createElement("button");
  b.type = "button"; b.className = "row" + (opts.cls ? " "+opts.cls : "");
  b.innerHTML = `<span class="n"></span><span class="badge"></span>`;
  b.querySelector(".n").textContent = p.name;
  if(p.kana && opts.showKana){ const k = document.createElement("span"); k.className="k"; k.textContent = p.kana; b.querySelector(".n").appendChild(k); }
  const bd = b.querySelector(".badge");
  if(p.role==="couple"){ bd.classList.add("couple"); bd.textContent = p.side==="groom" ? "新郎" : "新婦"; }
  else { bd.classList.add(p.side); bd.textContent = SIDE_LABEL[p.side]; }
  if(opts.sub){ const s = document.createElement("span"); s.className="sub"; s.textContent = opts.sub; b.appendChild(s); }
  return b;
}

// ---------- あなたは誰？ ----------
function openWho(){
  $("whoSearch").value = "";
  renderWho("");
  show("ovWho");
  setTimeout(()=>{ try{ $("whoSearch").focus(); }catch(_){} }, 50);
}
function renderWho(q){
  q = normText(q);
  const box = $("whoList"); box.innerHTML = "";
  const guests = PEOPLE.filter(p=>p.role==="guest");
  const hit = guests.filter(p=>matches(p,q));
  const rest = q ? guests.filter(p=>!matches(p,q)) : [];
  if(q && hit.length===0){ const e=document.createElement("div"); e.className="empty"; e.textContent="見つかりません。別の書き方で検索してみてください"; box.appendChild(e); }
  hit.forEach(p=>{ const r = personRow(p,{showKana:true}); r.addEventListener("click", ()=>chooseMe(p)); box.appendChild(r); });
  if(rest.length){
    const h = document.createElement("div"); h.className="row hdr"; h.textContent = "その他"; box.appendChild(h);
    rest.forEach(p=>{ const r = personRow(p,{cls:"dim", showKana:true}); r.addEventListener("click", ()=>chooseMe(p)); box.appendChild(r); });
  }
}
function chooseMe(p){
  confirmDialog("確認", `「${p.name}」(${SIDE_LABEL[p.side]})で始めますか？`, ()=>{
    if(state.me && state.me.name !== p.name){
      // 自分を変えた場合、自分自身が登録されていたら外す
      for(const k of Object.keys(state.cells)){ if(state.cells[k].name === p.name) delete state.cells[k]; }
      save(LS.cells, state.cells);
    }
    state.me = p; save(LS.me, p.name);
    hide("ovWho"); renderAll(); checkBingo(false);
    toast(`ようこそ ${p.name} さん`);
  }, "この名前で始める", "違う");
}
$("whoSearch").addEventListener("input", (e)=>renderWho(e.target.value));

// ---------- 該当者を選ぶ ----------
let pickIndex = -1, pickSide = "groom";
function allowedFor(item){
  // そのマスに登録できる人の一覧
  if(item.only==="groom") return PEOPLE.filter(p=>p.role==="couple" && p.side==="groom");
  if(item.only==="bride") return PEOPLE.filter(p=>p.role==="couple" && p.side==="bride");
  let list = PEOPLE.filter(p=>p.role==="guest" && !(state.me && p.name===state.me.name));
  if(item.only==="opposite" && state.me) list = list.filter(p=>p.side!==state.me.side);
  return list;
}
function usedBy(name, exceptIndex){
  for(const k of Object.keys(state.cells)){
    if(+k===exceptIndex) continue;
    if(state.cells[k].name===name) return +k;
  }
  return -1;
}
function openPick(i){
  pickIndex = i;
  const item = state.card[i];
  $("pickTask").textContent = item.text;
  $("pickSearch").value = "";
  const allowed = allowedFor(item);
  const sides = new Set(allowed.map(p=>p.side));
  const seg = $("pickSeg");
  const showSeg = !item.only && sides.size>1;
  seg.style.display = showSeg ? "" : "none";
  // 初期タブ: 自分と反対側(知らない人と話す動機づけ)
  pickSide = (state.me && state.me.side==="groom") ? "bride" : "groom";
  if(!showSeg) pickSide = null;
  renderPick();
  show("ovPick");
}
function renderPick(){
  const item = state.card[pickIndex];
  const q = normText($("pickSearch").value);
  const seg = $("pickSeg");
  seg.querySelectorAll("button").forEach(b=>{
    b.classList.toggle("on", b.dataset.side===pickSide);
    b.classList.toggle(b.dataset.side, b.dataset.side===pickSide);
  });
  let list = allowedFor(item);
  if(pickSide && !q) list = list.filter(p=>p.side===pickSide); // 検索中は両側から探す
  const box = $("pickList"); box.innerHTML = "";
  const hit = list.filter(p=>matches(p,q));
  if(hit.length===0){ const e=document.createElement("div"); e.className="empty"; e.textContent = q ? "見つかりません" : "選べる人がいません"; box.appendChild(e); }
  hit.forEach(p=>{
    const u = usedBy(p.name, pickIndex);
    if(u>=0){
      const r = personRow(p,{cls:"used", sub:"登録済: "+state.card[u].text});
      box.appendChild(r);
    }else{
      const r = personRow(p,{});
      r.addEventListener("click", ()=>pickPerson(p));
      box.appendChild(r);
    }
  });
}
function pickPerson(p){
  const i = pickIndex, item = state.card[i];
  confirmDialog("本人に確認した？", `「${item.text}」に ${p.name} さんを登録します。本人に聞いて確認しましたか？`, ()=>{
    state.cells[i] = { name:p.name, side:p.side, at:new Date().toISOString() };
    if(!save(LS.cells, state.cells)){ delete state.cells[i]; return; }
    hide("ovPick"); pickIndex = -1;
    renderGrid(); renderHeader();
    checkBingo(true);
  }, "確認した・登録", "まだ");
}
$("pickSeg").addEventListener("click", (e)=>{
  const b = e.target.closest("button"); if(!b) return;
  pickSide = b.dataset.side; renderPick();
});
$("pickSearch").addEventListener("input", renderPick);
$("pickCancel").addEventListener("click", ()=>{ hide("ovPick"); pickIndex=-1; });
$("ovPick").addEventListener("click", (e)=>{ if(e.target.id==="ovPick"){ hide("ovPick"); pickIndex=-1; } });

let viewIndex = -1;
function openView(i){
  viewIndex = i;
  const c = state.cells[i];
  const p = byName(c.name);
  $("viewTask").textContent = state.card[i].text;

  $("viewTime").textContent = c.at ? "登録 " + fmtTime(c.at) : "";
  show("ovView");
}

$("ovView").addEventListener("click", (e)=>{ if(e.target.id==="ovView") hide("ovView"); });
$("viewDelete").addEventListener("click", ()=>{
  const i = viewIndex;
  confirmDialog("取り消し", `「${state.cells[i].name}」さんの登録を取り消しますか？`, ()=>{
    delete state.cells[i];
    save(LS.cells, state.cells);
    hide("ovView");
    renderGrid(); renderHeader();
    checkBingo(false);
    toast("取り消しました");
  });
});

// ---------- BINGO ----------
function fmtTime(iso){
  const d = new Date(iso);
  const p = (n)=>String(n).padStart(2,"0");
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function checkBingo(announce){
  const done = completedLineIdx(state.cells);
  if(done.length >= state.winLines){
    if(!state.bingo){
      state.bingo = { at: new Date().toISOString(), lines: done.slice(0, state.winLines) };
      save(LS.bingo, state.bingo);
      renderHeader();
      showBingo();
      celebrate();
    }
  }else if(state.bingo){
    state.bingo = null; remove(LS.bingo); renderHeader();
    toast("BINGOの記録を取り消しました");
  }
}
function showBingo(){
  const b = state.bingo; if(!b) return;
  $("bingoTime").textContent = fmtTime(b.at);
  $("bingoCardId").textContent = cardIdOf(state.seed);
  $("bingoWho").textContent = state.me ? `${state.me.name}(${SIDE_LABEL[state.me.side]})` : "";
  const box = $("bingoLines"); box.innerHTML = "";
  const lines = (b.lines && b.lines.length) ? b.lines : completedLineIdx(state.cells).slice(0, state.winLines);
  lines.forEach((li)=>{
    const h = document.createElement("div"); h.className = "bingo-line-title"; h.textContent = "◆ " + lineName(li); box.appendChild(h);
    LINES[li].forEach((k)=>{
      const c = state.cells[k]; if(!c) return;
      const p = byName(c.name);
      const card = document.createElement("div"); card.className = "sigcard";
      card.innerHTML = `<div class="meta"><div class="t"></div><div class="n"></div></div><span class="badge"></span>`;
      card.querySelector(".t").textContent = state.card[k].text;
      card.querySelector(".n").textContent = c.name;
      const bd = card.querySelector(".badge");
      if(p && p.role==="couple"){ bd.classList.add("couple"); bd.textContent = p.side==="groom"?"新郎":"新婦"; }
      else { bd.classList.add(c.side||"groom"); bd.textContent = SIDE_LABEL[c.side] || ""; }
      box.appendChild(card);
    });
  });
  show("bingoScreen");
  window.scrollTo(0,0);
}
function celebrate(){
  const flash = document.createElement("div"); flash.className = "flash";
  document.body.appendChild(flash);
  setTimeout(()=>flash.remove(), 1200);
  const box = document.createElement("div"); box.className = "confetti";
  const colors = ["#e8b4b8","#d48f96","#c9a96e","#f1e5cc","#b9cbb6","#dde6ef","#fff"];
  for(let i=0;i<70;i++){
    const p = document.createElement("i");
    p.style.left = (Math.random()*100) + "%";
    p.style.background = colors[i % colors.length];
    p.style.animationDuration = (2.2 + Math.random()*1.8) + "s";
    p.style.animationDelay = (Math.random()*0.8) + "s";
    p.style.transform = `rotate(${Math.random()*360}deg)`;
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(), 5000);
  if(navigator.vibrate){ try{ navigator.vibrate([120,60,120]); }catch(_){} }
}
$("bingoClose").addEventListener("click", ()=>hide("bingoScreen"));

function openPin(){
  $("pinInput").value = ""; $("pinErr").textContent = "";
  show("ovPin");
  setTimeout(()=>$("pinInput").focus(), 50);
}
$("pinCancel").addEventListener("click", ()=>hide("ovPin"));
$("pinOk").addEventListener("click", checkPin);
$("pinInput").addEventListener("keydown", (e)=>{ if(e.key==="Enter") checkPin(); });
function checkPin(){
  if($("pinInput").value === ORGANIZER_PIN){ hide("ovPin"); openMenu(); }
  else { $("pinErr").textContent = "暗証番号が違います"; $("pinInput").value = ""; }
}
function openMenu(){
  $("menuStatus").textContent = `カードID ${cardIdOf(state.seed)} ／ ${state.me ? state.me.name : "名前未選択"} ／ 勝利条件: ${state.winLines}列`;
  $("menuWin").textContent = `勝利条件を ${state.winLines===1?2:1}列 に切り替える`;
  show("ovMenu");
}
$("menuClose").addEventListener("click", ()=>hide("ovMenu"));
$("menuWho").addEventListener("click", ()=>{ hide("ovMenu"); openWho(); });
$("menuRegen").addEventListener("click", ()=>{
  confirmDialog("カードを作り直す", "お題を新しく配り直します。登録済みの内容はすべて消えます。よろしいですか？", ()=>{
    state.seed = newSeed(); save(LS.seed, state.seed);
    state.card = buildCard(state.seed);
    state.cells = {}; remove(LS.cells);
    state.bingo = null; remove(LS.bingo);
    hide("ovMenu"); renderAll(); toast("新しいカードにしました");
  });
});
$("menuWin").addEventListener("click", ()=>{
  state.winLines = state.winLines===1 ? 2 : 1;
  save(LS.win, state.winLines);
  renderHeader(); openMenu();
  checkBingo(false);
  toast(`勝利条件: ${state.winLines}列`);
});
$("menuWipe").addEventListener("click", ()=>{
  confirmDialog("全データ削除", "カード・登録・名前・設定をすべて削除して最初の状態に戻します。よろしいですか？", ()=>{
    Object.values(LS).forEach(remove);
    location.reload();
  });
});

// ---------- 起動 ----------
try{ init(); }
catch(e){
  document.body.innerHTML = `<div style="padding:24px;color:#c75b5b;font-size:15px">設定エラー: ${String(e.message||e)}</div>`;
  console.error(e);
}
})();
</script>
</body>
</html>
